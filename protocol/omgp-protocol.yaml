# OMGP Protocol Definition — single source of truth
# Edit this file, run tools/codegen.py, update docs tables in the same commit.
# Versioned with the protocol, not the software.

protocol:
  major: 1
  minor: 0

limits:
  # F10 (#110/#154, 2026-09-06 ruling): the two were one symbol until this split conflated
  # "how big a trunk frame's payload is" with "how big an L3 message's own payload field is".
  # max_l3_message is trunk §4's frame-payload budget (one whole L3 message: 5-byte L3 header
  # + L3 payload); max_l3_payload is what's left for the L3 payload itself once the header is
  # subtracted. L2 code (link/) bounds against max_l3_message; L3 code (l3/) bounds
  # payload_len and every payload codec against max_l3_payload.
  max_l3_message: 64          # bytes; trunk §4 "Max payload" — one whole L3 message per frame
  max_l3_payload: 59          # derived: max_l3_message(64) - l3::HEADER_LEN(5)
  max_descriptor_bytes: 2048
  module_bus_chunk: 28        # READ_DESC max_len on module bus (SMBus block fit)
  max_nodes: 128
  param_value_max: 4095       # 12-bit logical resolution
  error_detail_max: 4         # F2 (#110/#154): ERROR.detail cap, both directions
  # F7 (#110/#154): CHANNEL.index and PARAM.param_id are each u8 (protocol-l3 §4.1), so at
  # most 256 distinct values exist to be unique over (0-255) — the binding constraint. The
  # 2048-byte descriptor cap alone would allow more (a minimum 4-byte CHANNEL record fits
  # 512x; a minimum 7-byte PARAM record fits 292x), so the id width, not the blob, decides.
  max_channels: 256
  max_params: 256
  max_slots_per_backplane: 16 # F12 (#110/#154): spec §5 reference FX backplane, 8-16 positions
                               # (the larger of the two reference backplane types — preamp is
                               # capped at 4). Design guidance, not BP_SLOT_MAP's own wire cap —
                               # see bp_slot_map_max_slots below, deliberately larger.
  # R-01 (specs/003-host-core-engine, #676/T005), reconciled with F10's max_l3_payload split
  # (docs/OPEN-QUESTIONS.md 2026-09-21 "BP_SLOT_MAP wire format (R-01)"): the largest
  # slot_count whose two ceil(slot_count/8)-byte bitmaps (occupied, changed) still fit
  # max_l3_payload (59): 1 + 2*ceil(n/8) <= 59 => n <= 232 (233 needs 1+2*30=61). Deliberately
  # larger than max_slots_per_backplane (16, the reference design) so a bigger-than-reference
  # backplane stays protocol-legal without a wire-format change — this is a protocol ceiling,
  # not a hardware target.
  bp_slot_map_max_slots: 232
  # F7 (#110/#154) descriptor field ranges — spec §15/§18/§19/§9. Enforced by hand-written
  # range checks in l3/l3_descriptor.cpp and tools/refimpl/omgp_descriptor.py (descriptor TLV
  # records are not codegen'd field-by-field the way l3_payloads is); named here so the value
  # has one source (rule 1) even though nothing in tools/codegen.py consumes it structurally.
  switching_settle_ms_max: 5000        # spec §21/§22 give no explicit ceiling; 5s is generous
                                        # headroom over every settle time spec §7/§21 describes
                                        # and keeps SwitchingRec.settle_ms comfortably below a
                                        # pathological host-side timeout
  power_lv_p15_ma_max: 150             # spec §15 +15V per-slot target
  power_lv_n15_ma_max: 150             # spec §15 -15V per-slot target
  power_lv_p9_ma_max: 500              # spec §15 +9V per-slot target
  power_lv_p5_ma_max: 1000             # spec §15 +5V per-slot target
  tube_heater_max_ma_ceiling: 2000     # spec §18 T4's 2.0A heater allocation (the largest class)
  tube_bplus_max_ma_ceiling: 40        # spec §18 "Initial v1 maximum B+ allocation... is 40 mA"
  tube_bplus_nom_v_max: 300            # spec §19 B+ architectural range ~180-300V DC
  audio_max_mvrms: 10000               # spec §9 "Routing design target ~10 Vrms clean where
                                        # practical" / "Raw power-amp output 8-10 Vrms clean
                                        # target" — the highest documented reference figure

addressing:
  host: 0x00
  backplane_min: 0x01
  backplane_max: 0x0F
  module_min: 0x10
  module_max: 0x7F
  reserved_min: 0x80          # future multicast/broadcast; MUST NOT be used in v1
  module_i2c_base: 0x20       # module bus address = base + slot_id

l3_flags:
  response: 0x01
  error: 0x02

opcodes:
  PING:           {code: 0x01, target: any,       idempotent: true}
  IDENTIFY:       {code: 0x02, target: any,       idempotent: true}
  READ_DESC:      {code: 0x03, target: any,       idempotent: true}
  SELECT_CHANNEL: {code: 0x10, target: module,    idempotent: true, semantics: accept_then_settle}
  SET_BYPASS:     {code: 0x11, target: module,    idempotent: true}
  SET_PARAM:      {code: 0x12, target: module,    idempotent: true, note: absolute values only}
  GET_PARAM:      {code: 0x13, target: module,    idempotent: true}
  GET_STATUS:     {code: 0x14, target: any,       idempotent: true}
  GET_EVENT:      {code: 0x15, target: any,       idempotent: false, note: drains queue; replay-safe via L2 seq replay buffer}
  BP_SLOT_MAP:    {code: 0x20, target: backplane, idempotent: true}
  BP_POWER:       {code: 0x21, target: backplane, idempotent: true}
  BP_ROUTE:       {code: 0x22, target: backplane, idempotent: true, status: provisional}
  ERROR:          {code: 0x7F, target: response_only}

reserved_opcode_ranges:
  firmware_update: {min: 0x60, max: 0x6F}   # design pending; do not allocate

error_codes:
  ERR_UNKNOWN_OPCODE: 0x01
  ERR_BAD_PAYLOAD:    0x02
  ERR_UNKNOWN_TARGET: 0x03    # unknown param/channel
  ERR_BUSY:           0x04    # settling or bridge in-flight; retry later
  ERR_NOT_PERMITTED:  0x05
  ERR_INTERNAL:       0x06

node_states:
  INIT: 0
  READY: 1
  SETTLING: 2
  FAULT: 3
  DISABLED: 4

events:
  NONE:                   0x00   # GET_EVENT response when the queue is empty (ruled 2026-08-28)
  CHANNEL_SETTLED:        0x01  # detail = [u8 channel, u8 seq] (F9, #110/#154, 2026-09-06
                                 # ruling); GET_EVENT's detail tail stays generic bytes at the
                                 # L3 codec level (protocol-l3 §3.4) — this layout is a host
                                 # rule, applied by the consumer of a drained CHANNEL_SETTLED
                                 # event, not a separate L3 codec: accept only for the channel
                                 # currently outstanding a switch, cross-checked against the
                                 # node's own last GET_STATUS.active_channel before un-muting
  FAULT_RAISED:           0x02
  FAULT_CLEARED:          0x03
  PARAM_CHANGED_LOCALLY:  0x04   # reserved; modules have no local controls in v1
  USER_DEFINED_MIN:       0xF0
  USER_DEFINED_MAX:       0xFF

param_kinds:
  CONTINUOUS: 0
  TOGGLE: 1
  ENUM: 2
  MOMENTARY: 3
  TRIGGER: 4
  READONLY: 5

tlv:
  PROTOCOL:     {type: 0x01, required: true}
  MODULE_TYPE:  {type: 0x02, required: true}
  NAME:         {type: 0x03, required: true,  max_len: 24}
  MANUFACTURER: {type: 0x04, required: true,  max_len: 24}
  MODEL_ID:     {type: 0x05, required: true}
  SERIAL:       {type: 0x06, required: false, max_len: 16}
  CHANNEL:      {type: 0x10, required: true,  repeated: true}
  SWITCHING:    {type: 0x11, required: true}
  PARAM:        {type: 0x20, required: true,  repeated: true}
  PARAM_ENUM:   {type: 0x21, required: false, repeated: true}
  AUDIO:        {type: 0x30, required: true}
  POWER_LV:     {type: 0x40, required: true}
  POWER_TUBE:   {type: 0x41, required: false}
  VENDOR:       {type: 0x7E, required: false, repeated: true}

module_types:      # Spec §4 classes
  ANALOGUE_EFFECT: 0x01
  SMART_ANALOGUE:  0x02
  TUBE_PREAMP:     0x03
  SS_PREAMP:       0x04
  DSP_EFFECT:      0x05
  HYBRID:          0x06
  SIMULATION:      0x07
  ROUTING_MIXER:   0x08
  OUTPUT:          0x09
  CONTROL:         0x0A
  POWER:           0x0B
  TUBE_POWER:      0x0C
  DEVELOPMENT:     0x0D

link_trunk:        # trunk spec §9 conformance timing
  bit_rate: 1000000
  bit_rate_fallback: 115200
  flag_byte: 0x7E
  escape_byte: 0x7D
  escape_xor: 0x20
  crc: crc16_ccitt_false
  T_turn_min_us: 20
  T_turn_max_us: 100
  T_resp_us: 200
  T_gap_us: 50
  T_poll_us: 2000
  retries: 2
  suspect_after_failures: 3
  offline_after_suspect_ms: 1000

module_bus:
  speed_hz: 400000
  conventions: smbus            # PEC, clock-low timeout, SMBALERT via IRQ#
  transaction_timeout_ms: 5

# L3 payload layouts (protocol-l3 §3.1, §3.3). Fields in wire order; multi-byte
# integers little-endian. `bytes` is a variable tail (to end of payload) unless
# `len_from` names the preceding length field. Response layouts for IDENTIFY,
# READ_DESC, GET_PARAM, GET_EVENT and the empty "accepted" responses were ruled
# 2026-08-28 (docs/OPEN-QUESTIONS.md) and are provisional. `opaque: true` means
# the format is not yet defined and v1 codecs pass the bytes through verbatim.
l3_payloads:
  PING:
    request:  []
    response: []
  IDENTIFY:
    request:  []
    response: [{name: major, type: u8}, {name: minor, type: u8}, {name: module_type, type: u8},
               {name: desc_len, type: u16}, {name: desc_crc, type: u16}]
  READ_DESC:
    request:  [{name: offset, type: u16}, {name: max_len, type: u8}]
    response: [{name: offset, type: u16}, {name: len, type: u8}, {name: bytes, type: bytes, len_from: len}]
  SELECT_CHANNEL:
    request:  [{name: channel, type: u8}]
    response: []                # accepted; completion arrives as CHANNEL_SETTLED event (§3.2)
  SET_BYPASS:
    request:  [{name: bypass, type: u8, max: 1}]
    response: []
  SET_PARAM:
    request:  [{name: param_id, type: u8}, {name: scope, type: u8}, {name: value, type: u16, max: 4095}]
    response: []
  GET_PARAM:
    request:  [{name: param_id, type: u8}, {name: scope, type: u8}]
    response: [{name: param_id, type: u8}, {name: scope, type: u8}, {name: value, type: u16, max: 4095}]
  GET_STATUS:
    request:  []
    response: [{name: state, type: u8, max: 4}, {name: active_channel, type: u8}, {name: bypass, type: u8, max: 1},
               {name: fault_code, type: u8}, {name: uptime_s, type: u16}, {name: event_pending, type: u8}]
  GET_EVENT:
    request:  []
    response: [{name: event_type, type: u8}, {name: remaining_count, type: u8}, {name: detail, type: bytes}]
  # R-01 (specs/003-host-core-engine, #676/T005): u8 slot_count, then two ceil(slot_count/8)
  # byte bitmaps (occupied, changed) back to back — contracts/bp-slot-map.md is the
  # authoritative layout. Modelled here as slot_count + one combined trailing `bitmaps` field
  # (bound: 2*29 = 58 bytes, both bitmaps at their max size) rather than two separate `bytes`
  # fields, since codegen's schema supports only one trailing `bytes` field per direction —
  # this gives byte-identical wire bytes and correct resp_min/resp_max (1 / 59) without a new
  # derived-length field form with no other consumer.
  # NOT LOSSLESS: PAYLOAD_FIELDS (tools/codegen.py, contracted by
  # specs/001-protocol-foundation/contracts/generated-constants.md) is a documented
  # machine-readable per-opcode field schema, and this collapsed model erases the real
  # occupied/changed split and the len == ceil(slot_count/8) relationship from it — a
  # consumer generating code from PAYLOAD_FIELDS alone gets a decoder that is wrong for this
  # opcode. contracts/bp-slot-map.md and the hand-written l3/l3_payload codecs remain the
  # actual source of truth for the two-bitmap shape (red team, PR #773 round 1, finding 3 —
  # an earlier version of this comment claimed nothing was lost; that claim was false).
  # (docs/OPEN-QUESTIONS.md 2026-09-21 "BP_SLOT_MAP wire format (R-01)"). The request
  # direction is artefact-silent in the contract; `[]` follows the GET_STATUS precedent
  # (host-initiated poll, no request payload).
  BP_SLOT_MAP:
    request:  []
    response: [{name: slot_count, type: u8}, {name: bitmaps, type: bytes, max: 58}]
  BP_POWER:    {opaque: true}
  BP_ROUTE:    {opaque: true}
  ERROR:
    # detail is capped at 4 bytes (F2, #110/#154 — limits.error_detail_max), not
    # max_l3_payload — a short structured hint (e.g. the offending param_id or an OutOfRange
    # field's value), not a general-purpose tail. The literal 4 here must equal
    # limits.error_detail_max (tools/codegen.py's `_bounds` has no cross-reference between a
    # field's own `max` and a named limit; enforcement in l3/l3_payload.cpp and
    # tools/refimpl/omgp_l3.py reads the named LIMIT_error_detail_max symbol instead, so a
    # future edit here without also updating that limit fails a diffcheck round-trip, not
    # silently).
    response: [{name: code, type: u8}, {name: detail, type: bytes, max: 4}]

descriptor:
  crc: crc16_ccitt_false        # over the entire blob as served by READ_DESC (ruled 2026-08-28);
                                # size cap is limits.max_descriptor_bytes — one value, one key
