name: agent-dispatch
# Autonomous backlog pull (AI-DLC L3 mode 4). Every 2 hours, whenever a PR merges, and whenever a story passes ready-gate: if the WIP cap
# allows, claim the oldest human-released task (label: task + ready) and
# implement it, opening a PR for review. Humans release work by applying
# `ready`; agents NEVER pull from raw `task`. Kill switch: disable this
# workflow or remove `ready` labels.
on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:
  repository_dispatch:
    # Sent by ready-gate when a story passes (a human `ready`, or promote-queued's promotion):
    # the moment a story becomes claimable, not the next tick. `pick` stays a no-op under the cap.
    types: [backlog-changed]
  pull_request:
    # A merged PR is the moment the WIP cap most likely opens: run `pick` right away instead
    # of waiting for the next tick. `pick` is a no-op whenever the cap is still held, and the
    # job guard below restricts this trigger to merged, same-repository PRs (no fork PR ever
    # reaches a job that carries secrets — GOVERNANCE.md §4b).
    types: [closed]

permissions:
  id-token: write   # anthropics/claude-code-action exchanges an OIDC token for its App token; without this every run fails "Could not fetch an OIDC token" (found 2026-08-29)
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-dispatch        # one dispatcher instance, ever
  cancel-in-progress: false

jobs:
  pick:
    if: >
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.select.outputs.issue }}
    steps:
      - name: Select next task (WIP cap 1, oldest ready first)
        id: select
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            // WIP cap: any open agent PR, or any issue already claimed, blocks a new pull
            const openPRs = await github.rest.pulls.list({owner, repo, state: 'open', per_page: 100});
            if (openPRs.data.some(p => p.labels.some(l => l.name === 'agent-authored'))) {
              core.notice('WIP cap: agent PR awaiting review — not pulling'); return;
            }
            const claimed = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'task,in-progress', per_page: 10});
            if (claimed.data.length) {
              core.notice('WIP cap: a task is already in progress — not pulling'); return;
            }
            // Oldest ready task = created first = tasks.md order = dependency order
            const ready = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'task,ready',
              sort: 'created', direction: 'asc', per_page: 20});
            const next = ready.data.find(i =>
              !i.labels.some(l => ['blocked','needs-human','in-progress'].includes(l.name))
              && !i.pull_request);
            if (!next) { core.notice('Backlog: nothing ready'); return; }
            // Claim: label + audit comment
            await github.rest.issues.addLabels({owner, repo, issue_number: next.number,
              labels: ['in-progress','agent-authored']});
            await github.rest.issues.createComment({owner, repo, issue_number: next.number,
              body: `🤖 Claimed by agent-dispatch run [${context.runId}](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}). Remove \`in-progress\` to revoke.`});
            core.setOutput('issue', String(next.number));

  implement:
    needs: pick
    if: needs.pick.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          pip install jinja2 pyyaml pytest
      - name: Claude Code — implement task
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: github-actions   # backlog-changed nudges are sent by ready-gate with GITHUB_TOKEN, so the run's actor is github-actions[bot]; without this the action refuses (run 33332211854 on #28, same class as #77)
          prompt: |
            You are the backlog agent. Read CLAUDE.md and
            docs/OPERATING-POLICY.md first; stay strictly within agent
            permissions. Your task is issue #${{ needs.pick.outputs.issue }}.
            1. Read the issue and its Spec Kit feature context under
               specs/<NNN-feature>/, plus the relevant docs/ sections it cites.
            2. Implement TDD-style: failing tests/scenario first, then code,
               iterating with ./pipeline.sh stages until the FULL local
               pipeline is green.
            3. Commit on branch task/<issue-number> with `Refs #<n>` in
               commits; open a PR titled after the task, labelled
               agent-authored + the task's feature label, body summarising
               approach and evidence, containing the closing reference in
               EXACTLY the form `Closes #<n>` (the number directly after
               the keyword, on its own line). GitHub honours no other
               form: `Closes T021 (issue #39)` on #114 closed nothing,
               left `in-progress` on the issue and stalled the WIP cap.
            4. If you discover the task is blocked, ambiguous beyond a safe
               default, or requires a human-ruling artefact (protocol YAML,
               vectors, spec docs): implement nothing speculative — comment
               your analysis on the issue, swap `in-progress` for
               `needs-human`, and stop.
          claude_args: |
            --allowedTools "Bash(./pipeline.sh*),Bash(git*),Bash(gh pr create*),Bash(gh issue*),Edit,Read,Write,Grep,Glob"

      - name: Release claim if no PR was opened
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const n = Number('${{ needs.pick.outputs.issue }}');
            await github.rest.issues.removeLabel({...context.repo, issue_number: n, name: 'in-progress'}).catch(()=>{});
            await github.rest.issues.createComment({...context.repo, issue_number: n,
              body: `🤖 Dispatch run failed before completing — claim released. See run ${context.runId}.`});
