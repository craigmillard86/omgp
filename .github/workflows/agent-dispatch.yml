name: agent-dispatch
# Autonomous backlog pull (AI-DLC L3 mode 4). Every 2 hours, whenever a PR merges, and whenever a story passes ready-gate: if the WIP cap
# allows, claim the oldest human-released task (label: task + ready) and
# implement it, opening a PR for review. Humans release work by applying
# `ready`; agents NEVER pull from raw `task`. Kill switch: disable this
# workflow or remove `ready` labels.
on:
  schedule:
    - cron: '15 */2 * * *'
  workflow_dispatch:
  repository_dispatch:
    # Sent by ready-gate when a story passes (a human `ready`, or promote-queued's promotion):
    # the moment a story becomes claimable, not the next tick. `pick` stays a no-op under the cap.
    types: [backlog-changed]
  pull_request:
    # A merged PR is the moment the WIP cap most likely opens: run `pick` right away instead
    # of waiting for the next tick. `pick` is a no-op whenever the cap is still held, and the
    # job guard below restricts this trigger to merged, same-repository PRs (no fork PR ever
    # reaches a job that carries secrets — GOVERNANCE.md §4b).
    types: [closed]

permissions:
  id-token: write   # anthropics/claude-code-action exchanges an OIDC token for its App token; without this every run fails "Could not fetch an OIDC token" (found 2026-08-29)
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-dispatch        # one dispatcher instance, ever
  cancel-in-progress: false

jobs:
  pick:
    if: >
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.select.outputs.issue }}
    steps:
      - uses: actions/checkout@v7
        with: {sparse-checkout: .github, sparse-checkout-cone-mode: false}
      - id: cfg
        run: |
          echo "cap=$(sed -n 's/^wip_cap: *//p' .github/agent-config.yml)" >> "$GITHUB_OUTPUT"
      - name: Select next task (WIP cap from agent-config, oldest ready first)
        id: select
        uses: actions/github-script@v7
        env:
          WIP_CAP: ${{ steps.cfg.outputs.cap }}
        with:
          script: |
            const {owner, repo} = context.repo;
            // WIP cap counts STORIES in flight (ruling 2026-09-03): open agent-authored
            // PRs ∪ claimed task issues, joined on the task/<n> head-branch convention so
            // a story with both counts once. needs-human PRs still count (review load);
            // a non-task/<n> agent branch counts fail-closed. wip_cap: 1 in agent-config
            // restores the original behaviour; an unreadable value fails closed to 1.
            const rawCap = Number.parseInt(process.env.WIP_CAP || '', 10);
            const cap = Number.isInteger(rawCap) && rawCap >= 1 ? rawCap : 1;
            if (cap !== rawCap) core.notice('wip_cap unreadable — using 1 (fail closed)');
            const openPRs = (await github.rest.pulls.list({owner, repo, state: 'open', per_page: 100})).data
              .filter(p => p.labels.some(l => l.name === 'agent-authored'));
            const claimed = (await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'task,in-progress', per_page: 100})).data;
            const stories = new Set();
            for (const p of openPRs) { const m = /^task\/(\d+)$/.exec(p.head.ref); stories.add(m ? `t${m[1]}` : `pr${p.number}`); }
            for (const i of claimed) stories.add(`t${i.number}`);
            if (stories.size >= cap) {
              core.notice(`WIP cap: ${stories.size} story(ies) in flight >= wip_cap=${cap} — not pulling`); return;
            }
            // Oldest ready task = created first = tasks.md order = dependency order
            const ready = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'task,ready',
              sort: 'created', direction: 'asc', per_page: 20});
            const next = ready.data.find(i =>
              !i.labels.some(l => ['blocked','needs-human','in-progress'].includes(l.name))
              && !i.pull_request);
            if (!next) { core.notice('Backlog: nothing ready'); return; }
            // Claim: label + audit comment
            await github.rest.issues.addLabels({owner, repo, issue_number: next.number,
              labels: ['in-progress','agent-authored']});
            await github.rest.issues.createComment({owner, repo, issue_number: next.number,
              body: `🤖 Claimed by agent-dispatch run [${context.runId}](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}). Remove \`in-progress\` to revoke.`});
            core.setOutput('issue', String(next.number));

  implement:
    needs: pick
    if: needs.pick.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          pip install -r tools/requirements.txt   # includes the clang-format pin: a bare ./pipeline.sh reaches stage_quality, which FAILS on CI without it (#135; #167 review)
      - name: Mark the start of the run
        id: t0
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # ONE prompt, read from a file, used by both the first pass and the retry. Two inline
      # copies would drift, and a drifted retry prompt silently changes the agent's instructions
      # on the second pass — the objection that made the first version of #361 ship no retry.
      - name: Load the agent prompt
        id: prompt
        env:
          ISSUE: ${{ needs.pick.outputs.issue }}
        run: |
          {
            echo "text<<PROMPT_EOF_${GITHUB_RUN_ID}"
            sed -e "s|{{ISSUE}}|${ISSUE}|g" .github/agent-prompts/implement.md
            echo "PROMPT_EOF_${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Claude Code — implement task
        id: agent                       # the execution file (turns, denials, is_error) is a step output; an id-less step has none
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: github-actions   # backlog-changed nudges are sent by ready-gate with GITHUB_TOKEN, so the run's actor is github-actions[bot]; without this the action refuses (run 33332211854 on #28, same class as #77)
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash(./pipeline.sh*),Bash(git*),Bash(gh pr create*),Bash(gh issue*),Edit,Read,Write,Grep,Glob"

      # The checkout above is this job's workspace, and the Claude step ran first holding Edit and
      # Write on it: requiring the detector from there let the monitored agent rewrite its own
      # no-op check and have github-script execute that edit with write scopes. GOVERNANCE §2 heads
      # the gate table "all mechanical, none trust-based". review-fix already took the module from
      # the default branch; dispatch did not (round-1 review on #416). Placed AFTER the agent step,
      # so the tree it commits from never sees this path.
      - name: Fetch the shared no-op detector from the default branch
        if: always()
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          sparse-checkout: |
            tools/ci
            .github/agent-config.yml
          sparse-checkout-cone-mode: false
          path: .agent-ci
          persist-credentials: false

      # #361. This step used to be `if: failure()`, which is why it never once fired: the five
      # observed no-ops (#54 twice, #342's fix twice, #58 after 156 turns / 26 denials / $9.07)
      # all exited SUCCESS having produced nothing, and left `in-progress` holding the WIP cap
      # until a human noticed days later. Detection now runs whatever the outcome.
      - name: Did the agent produce anything?
        id: detect
        if: always()
        uses: actions/github-script@v7
        env:
          KIND: implement
          ISSUE: ${{ needs.pick.outputs.issue }}
          SINCE: ${{ steps.t0.outputs.at }}
          EXEC_FILE: ${{ steps.agent.outputs.execution_file }}
        with:
          script: |
            const m = require(`${process.env.GITHUB_WORKSPACE}/.agent-ci/tools/ci/agent-noop.js`);
            await m.detect({github, context, core, env: process.env});

      - name: How many retries may this run spend?
        id: budget
        if: always()
        uses: actions/github-script@v7
        env:
          CONFIG: ${{ github.workspace }}/.agent-ci/.github/agent-config.yml
        with:
          script: |
            const m = require(`${process.env.GITHUB_WORKSPACE}/.agent-ci/tools/ci/agent-noop.js`);
            core.setOutput('n', String(m.retryBudget(process.env, core)));

      # #361 AC2. A no-op is retried once (agent_retry_max, default 1) before the claim is
      # released. The retry is a SECOND STEP rather than a loop because Actions has no loop — and
      # it reads the same prompt, so the two passes cannot diverge.
      - name: Claude Code — retry the task
        id: agent_retry
        if: always() && steps.detect.outputs.noop == 'true' && steps.budget.outputs.n != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: github-actions
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash(./pipeline.sh*),Bash(git*),Bash(gh pr create*),Bash(gh issue*),Edit,Read,Write,Grep,Glob"

      - name: Did the retry produce anything?
        id: detect_retry
        if: always() && steps.agent_retry.conclusion != 'skipped'
        uses: actions/github-script@v7
        env:
          KIND: implement
          ISSUE: ${{ needs.pick.outputs.issue }}
          SINCE: ${{ steps.t0.outputs.at }}
          EXEC_FILE: ${{ steps.agent_retry.outputs.execution_file }}
        with:
          script: |
            const m = require(`${process.env.GITHUB_WORKSPACE}/.agent-ci/tools/ci/agent-noop.js`);
            await m.detect({github, context, core, env: process.env});

      - name: Release the claim and fail loudly if it produced nothing
        id: finalize
        if: always()
        uses: actions/github-script@v7
        env:
          KIND: implement
          ISSUE: ${{ needs.pick.outputs.issue }}
          NOOP: ${{ steps.detect_retry.outputs.noop != '' && steps.detect_retry.outputs.noop || steps.detect.outputs.noop }}
          REASON: ${{ steps.detect_retry.outputs.reason != '' && steps.detect_retry.outputs.reason || steps.detect.outputs.reason }}
          ATTEMPTS: ${{ steps.detect_retry.outputs.noop != '' && '2' || '1' }}
          TURNS: ${{ steps.detect_retry.outputs.turns != '' && steps.detect_retry.outputs.turns || steps.detect.outputs.turns }}
          DENIALS: ${{ steps.detect_retry.outputs.denials != '' && steps.detect_retry.outputs.denials || steps.detect.outputs.denials }}
        with:
          script: |
            const m = require(`${process.env.GITHUB_WORKSPACE}/.agent-ci/tools/ci/agent-noop.js`);
            // An EMPTY noop means `detect` itself failed — a missing module, an API 403/500, a failed
            // checkout. The step this replaced was `if: failure()` and released the claim on any
            // job failure, so returning here would be a REGRESSION: the claim would sit held with
            // nothing said (round-1 red team + review). Unknown fails closed, like readFigures.
            if (process.env.NOOP === 'false') return;   // production established — nothing to release
            await m.finalize({github, context, core, env: process.env});

      # NO transcript artifact. GOVERNANCE §4b: "This repository is public", so an artifact is
      # downloadable by anyone, and secret masking covers step logs, not bytes inside an uploaded
      # file. `execution_file` is arbitrary tool output — `git remote -v`, `gh auth status` and the
      # like land in it verbatim — produced by a job holding CLAUDE_CODE_OAUTH_TOKEN. The first
      # version of this workflow uploaded it and called the artifact "private to the repo", which
      # was simply false (round-1 review on #416). The figures that actually diagnose a stall
      # (turns, denials, is_error) are in the job log and in the comment finalize posts.
