name: story-enrich
# PRD auto-population: label a task issue `enrich` and Claude fills the
# story sections from .specify/ artefacts and docs/, predicts a risk tier
# with rationale, then either auto-releases (tier <= auto_ready_max_tier)
# or queues it for human review. Merge approval is unaffected and always
# human (GOVERNANCE.md §1).
on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: story-enrich-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  enrich:
    if: github.event.label.name == 'enrich'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Claude Code — populate story to Definition of Ready
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the story-enrichment agent. Read CLAUDE.md,
            docs/DEFINITION-OF-READY.md, docs/GOVERNANCE.md §3 and
            .github/agent-config.yml first.
            Target: issue #${{ github.event.issue.number }} (a task issue).

            1. Read the issue, its feature's .specify/ artefacts (spec.md,
               plan.md, tasks.md) and the docs/ sections they reference.
            2. Rewrite the issue body to fully satisfy every section of the
               PRD scheme: concrete spec references (doc + section numbers),
               falsifiable checkbox acceptance criteria derived from spec.md
               acceptance criteria and plan.md, evidence required (name the
               scenarios), explicit out-of-scope naming adjacent temptations,
               dependencies as issue refs, and an Expected risk tier with a
               one-line rationale predicting the paths this task will touch.
               No REPLACE placeholders may remain. Preserve any content a
               human already wrote — enrich, don't overwrite rulings.
               Update via: gh issue edit.
            3. Swap label `enrich` for `enriched`.
            4. Decide release per .github/agent-config.yml:
               - predicted tier <= auto_ready_max_tier AND you are confident
                 the story is unambiguous: apply `ready` and comment
                 "auto-released at T<n>: <rationale>". The ready-gate will
                 still validate.
               - otherwise: do NOT apply `ready`; comment a 2-line summary
                 and what a human should check before releasing.
            5. If the task cannot be made ready from the artefacts alone
               (spec gap, unclear decomposition, inherent T3 content):
               label `needs-human` with your analysis and a proposed split.
            Never edit repository files; never apply `ready` above the
            configured tier; never remove human-authored issue content.
          claude_args: |
            --allowedTools "Bash(gh issue view*),Bash(gh issue edit*),Bash(gh issue comment*),Bash(gh label*),Read,Grep,Glob"
