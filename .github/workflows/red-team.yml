name: red-team
# Devil's-advocate testing: falsification, not confirmation. Two modes:
#  - PR mode (risk:t2/t3 labelled): attack the change — write and RUN
#    hostile tests/scenarios trying to break it; report only reproducible
#    reds or an explicit concession.
#  - Protocol mode (monthly/manual): attack the system through the
#    hostile-module threat model (malicious descriptors, bus babble,
#    resource exhaustion, power-declaration lies) and file findings.
# Rule of evidence: a finding without a runnable reproducer is not a finding.
# PR mode resolves the tier at RUN time (.github/actions/risk-tier): a `labeled`
# trigger never fired for risk-score's labels because GitHub starts no run for
# events caused by GITHUB_TOKEN (found 2026-08-29 — PR mode had never run).
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  schedule:
    - cron: '0 5 1 * *'      # monthly protocol red-team
  workflow_dispatch:
    inputs:
      mode:
        description: 'pr <number> or protocol'
        required: true

permissions:
  id-token: write   # anthropics/claude-code-action exchanges an OIDC token for its App token; without this every run fails "Could not fetch an OIDC token" (found 2026-08-29)
  contents: read
  checks: read
  issues: write
  pull-requests: write

concurrency:
  group: red-team-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  attack-pr:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0}
      - id: tier
        uses: ./.github/actions/risk-tier
        with: {pr: '${{ github.event.pull_request.number }}'}
      - name: Below T2 — no attack pass
        if: steps.tier.outputs.deep != 'true'
        run: |
          echo "red-team: PR is ${{ steps.tier.outputs.label }} — attack pass runs for T2/T3 only"
      - uses: actions/setup-python@v7
        if: steps.tier.outputs.deep == 'true'
        with: {python-version: '3.12'}
      - name: Toolchain
        if: steps.tier.outputs.deep == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          pip install jinja2 pyyaml pytest
      - name: Claude Code — adversarial attack on the change
        if: steps.tier.outputs.deep == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude   # same as claude-review: agent PRs are opened by the Claude App bot
          prompt: |
            You are the red team. Your stance: PR
            #${{ github.event.pull_request.number }} is WRONG and your job
            is to prove it. Read CLAUDE.md, the diff, and the spec sections
            it cites. Then ATTACK:
            - boundary and pathological inputs the tests don't cover
              (zero/max lengths, wraparound, truncation mid-frame,
              duplicate/out-of-order sequences)
            - timing attacks: retries colliding with settling, claims of
              idempotency under duplicated delivery, superframe budget
              starvation
            - hostile-module behaviour reachable through this change:
              descriptor lies, oversized TLVs, event-queue flooding,
              ERR_BUSY livelock
            - the tests themselves: write a plausible bug this diff COULD
              have contained and check the suite would have caught it
            METHOD: write your attacks as real tests/scenarios in a scratch
            directory (do NOT modify existing tests), run them via
            ./pipeline.sh stages and direct execution. Iterate.
            REPORT: one PR comment. For each finding: the runnable
            reproducer (inline, copy-pasteable), observed vs expected, and
            severity. If everything you tried passed, say exactly what you
            attacked and concede: "attacked N vectors, change held."
            Never file style opinions. Never modify the PR. A finding
            without a reproducer must be labelled speculation and last.
            End the comment with a required final section "NOT EXAMINED:"
            listing what was out of scope of this attack pass. If nothing
            was excluded, state that explicitly: "NOT EXAMINED: nothing
            excluded".
            After NOT EXAMINED, end with ONE final line, alone and exactly
            in this machine-readable form (the auto-approval gate parses it):
            `VERDICT(red-team): clean @ <head sha>` if and only if every
            attack held (no CONFIRMED findings; speculation does not count);
            otherwise `VERDICT(red-team): findings @ <head sha>`. <head sha>
            is the full 40-char head commit:
            ${{ github.event.pull_request.head.sha }}.
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash(./pipeline.sh*),Bash(g++*),Bash(python3*),Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr comment*),Read,Write,Grep,Glob"

  attack-protocol:
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'protocol')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          pip install jinja2 pyyaml pytest
      - name: Claude Code — hostile-module red team
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the protocol red team for an OPEN hardware platform:
            assume module firmware is written by adversaries. Read
            docs/protocol-l3.md, docs/trunk-link-layer.md,
            protocol/omgp-protocol.yaml and the current implementation.
            Threat model — a hostile or defective module that: lies in its
            descriptor (power, switching times, channel counts), floods
            events, holds IRQ# asserted, answers ERR_BUSY forever, replays
            stale responses, sends oversized/malformed TLVs, exhausts the
            descriptor cache, or times its responses to maximise trunk
            disruption through the bridge. Also: what can a hostile
            BACKPLANE do that a module cannot?
            For each viable attack: demonstrate it as a runnable scenario
            or test where the implementation exists, or as a precise
            walkthrough against the spec text where it does not, and state
            the defence (spec change, host mitigation, or accepted risk).
            OUTPUT: one issue titled "Protocol red-team <date>" labelled
            red-team + needs-human, findings severity-ordered with
            reproducers/walkthroughs, plus attacks tried that failed.
            End the issue with a required final section "NOT EXAMINED:"
            listing what was out of scope of this attack pass. If nothing
            was excluded, state that explicitly: "NOT EXAMINED: nothing
            excluded".
            Do not modify any repository file.
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash(./pipeline.sh*),Bash(python3*),Bash(gh issue*),Read,Write,Grep,Glob"
