name: agent-approve
# Verdict-gated PR approval (ruling 2026-08-31, docs/OPEN-QUESTIONS.md "Agent approval
# below T3"; hardened per the Copilot review on #103). Fires when claude[bot] posts a
# VERDICT comment. The trigger is `issue_comment` DELIBERATELY: those runs use the
# DEFAULT-BRANCH workflow definition and check out the default branch, so a same-repo PR
# can never rewrite this gate, the risk-tier resolver, or auto_approve_max_tier in its
# own diff — pull_request-triggered workflows run the PR's own version and must never
# hold approval logic. github-actions[bot] submits the approval (distinct from the
# authoring claude[bot]); T3 is never approved; CODEOWNERS paths still need the owner;
# the merge click remains human (GOVERNANCE.md §1). Kill switch: auto_approve_max_tier
# to -1, or disable this workflow.
# The script is executed verbatim by tests/workflows/agent_approve_harness.js.
on:
  issue_comment:
    types: [created]

concurrency:
  group: agent-approve-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  approve:
    if: github.event.issue.pull_request && github.event.comment.user.login == 'claude[bot]' && contains(github.event.comment.body, 'VERDICT(')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7   # issue_comment: this is the DEFAULT branch — never PR content
      - id: tier
        uses: ./.github/actions/risk-tier
        with: {pr: '${{ github.event.issue.number }}'}
      - id: cfg
        run: |
          echo "max=$(sed -n 's/^auto_approve_max_tier: *//p' .github/agent-config.yml)" >> "$GITHUB_OUTPUT"
      - name: Approve when every required verdict is clean at this head
        uses: actions/github-script@v7
        env:
          TIER_LABEL: ${{ steps.tier.outputs.label }}
          MAX_TIER: ${{ steps.cfg.outputs.max }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue = context.payload.issue;
            if (!issue.pull_request) { core.notice('approve: comment is on a plain issue — untouched'); return; }
            const c = context.payload.comment || {};
            if (!c.user || c.user.login !== 'claude[bot]' || !(c.body || '').includes('VERDICT(')) {
              core.notice('approve: trigger comment is not a claude[bot] verdict — untouched'); return;
            }
            // Fresh PR state from the API — never from any checkout.
            const pr = (await github.rest.pulls.get({owner, repo, pull_number: issue.number})).data;
            const head = pr.head.sha;
            if (!pr.labels.some(l => l.name === 'agent-authored')) { core.notice('approve: not an agent-authored PR — untouched'); return; }
            // Tier and knob: anything unresolved fails CLOSED (no approval). Both come from
            // base-side sources: the risk label (risk-score runs pull_request_target) and the
            // default-branch agent-config.yml checked out above.
            const m = (process.env.TIER_LABEL || '').match(/^risk:t([0-3])$/);
            if (!m) { core.notice('approve: risk tier unresolved — not approving (fail closed)'); return; }
            const tier = Number(m[1]);
            const max = Number.parseInt(process.env.MAX_TIER || '', 10);
            if (!Number.isInteger(max)) { core.notice('approve: auto_approve_max_tier unreadable — not approving (fail closed)'); return; }
            if (tier >= 3) { core.notice('approve: T3 is never auto-approved'); return; }
            if (tier > max) { core.notice(`approve: risk:t${tier} exceeds auto_approve_max_tier=${max}`); return; }
            // CODEOWNERS fail-closed (live finding 2026-08-31 on PR #104: a
            // github-actions[bot] approval SATISFIED require_code_owner_reviews, contrary
            // to the design assumption). This gate therefore never approves a PR touching
            // an owned path — those require the owner's own review, and an unreadable
            // CODEOWNERS refuses too. Patterns come from the DEFAULT-branch checkout.
            const fs = require('fs');
            let ownedPatterns;
            try {
              ownedPatterns = fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/.github/CODEOWNERS`, 'utf8')
                .split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#')).map(l => l.split(/\s+/)[0]);
            } catch (e) { core.notice(`approve: CODEOWNERS unreadable (${e.message}) — not approving (fail closed)`); return; }
            const ownedBy = (pattern, path) => {
              const p = pattern.startsWith('/') ? pattern.slice(1) : pattern;
              if (p.endsWith('/')) return path.startsWith(p);
              const re = new RegExp('^' + p.split('**').map(seg =>
                seg.split('*').map(x => x.replace(/[.+^${}()|[\]\\]/g, '\\$&')).join('[^/]*')).join('.*') + '$');
              return re.test(path) || path.startsWith(p + '/');
            };
            const changed = await github.paginate(github.rest.pulls.listFiles, {owner, repo, pull_number: pr.number, per_page: 100});
            const owned = changed.map(f => f.filename).filter(f => ownedPatterns.some(pat => ownedBy(pat, f)));
            if (owned.length) {
              core.notice(`approve: CODEOWNERS-owned path(s) changed — the owner's review is required, not auto-approving: ${owned.join(', ')}`);
              return;
            }
            // Dismiss THIS BOT's stale approvals from older heads (belt for
            // dismiss_stale_reviews being off); never touch a human's review.
            const reviews = await github.paginate(github.rest.pulls.listReviews, {owner, repo, pull_number: pr.number, per_page: 100});
            for (const r of reviews) {
              if (r.user && r.user.login === 'github-actions[bot]' && r.state === 'APPROVED' && r.commit_id !== head) {
                await github.rest.pulls.dismissReview({owner, repo, pull_number: pr.number, review_id: r.id,
                  message: `stale auto-approval: head moved to ${head.slice(0, 7)}`});
              }
            }
            // Verdicts: only from claude[bot] exactly, and only as the FINAL non-empty line of
            // the comment (Copilot review on #103: a verdict token mid-comment — e.g. quoted
            // attacker text — must never count). Latest matching comment wins.
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: pr.number, per_page: 100});
            const verdictOf = kind => {
              const re = new RegExp(`^VERDICT\\(${kind}\\):\\s*(clean|findings)\\s*@\\s*${head}$`);
              let latest = null;
              for (const cm of comments) {
                if (!cm.user || cm.user.login !== 'claude[bot]') continue;
                const lines = (cm.body || '').trim().split('\n');
                const hit = re.exec(lines[lines.length - 1].trim());
                if (hit) latest = hit[1];
              }
              return latest;
            };
            const review = verdictOf('review');
            if (review !== 'clean') { core.notice(review === null ? `approve: no review verdict for ${head.slice(0, 7)} — not approving` : 'approve: review reported findings'); return; }
            if (tier >= 2) {
              const rt = verdictOf('red-team');
              if (rt !== 'clean') { core.notice(rt === null ? `approve: no red-team verdict for ${head.slice(0, 7)} (required at T2) — not approving` : 'approve: red-team reported findings'); return; }
            }
            if (reviews.some(r => r.user && r.user.login === 'github-actions[bot]' && r.state === 'APPROVED' && r.commit_id === head)) {
              core.notice('approve: already approved at this head'); return;
            }
            await github.rest.pulls.createReview({owner, repo, pull_number: pr.number, commit_id: head, event: 'APPROVE',
              body: `🤖 Auto-approval (ruling 2026-08-31, docs/OPEN-QUESTIONS.md): risk:t${tier} <= auto_approve_max_tier=${max}; VERDICT(review): clean @ ${head.slice(0, 7)}${tier >= 2 ? '; VERDICT(red-team): clean' : ''}. CODEOWNERS paths still require the owner's review; the merge itself remains human (GOVERNANCE.md §1).`});
            core.notice(`approve: auto-approved at ${head.slice(0, 7)}`);
