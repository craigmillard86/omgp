name: ci-failure-router
# CI-failure auto-resolution (GOVERNANCE.md §4, ruled 2026-08-30). When a `ci` or
# `security` run fails, route by the failed run's head branch:
#   task/* with an open agent-authored PR  -> bounded auto-fix on that branch: at most
#                                             auto_fix_max_attempts attempts per PR (the
#                                             agent-config knob; labels auto-fix-<n>,
#                                             one attempt per commit), then needs-human
#   main                                   -> ci-failure + task issue (one open per workflow),
#                                             handled by agent-triage like nightly-failure
#   anything else (human work)             -> one short comment on the PR, never a push or label
# Fork runs are never touched. Kill switch: disable this workflow.
# The `route` script is executed verbatim by tests/workflows/ci_failure_router_harness.js.
# Delivery: `workflow_run` is NOT a reliable trigger for this loop. GitHub suppresses
# workflow_run chaining off runs that originate from a GITHUB_TOKEN push, and re-runs of
# such a run are a second suppressed path (both demonstrated on PR #108, 2026-08-31 —
# docs/OPEN-QUESTIONS.md). Fix (a): the autofix job checks out with persist-credentials:
# false so the agent's push carries the Claude App token, restoring chaining. Belt (b): a
# 2-hourly `sweep` scans open agent PRs for a failed ci/security run with no attempt marker
# and dispatches the router itself — a delivery path that does not depend on workflow_run
# semantics at all. Both, per the recommendation on that entry.
on:
  workflow_run:
    workflows: [ci, security]
    types: [completed]
  schedule:
    - cron: '17 */2 * * *'   # sweep: delivery backstop, offset off the hour to miss the runner rush
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Failed ci/security run to route (blank = run the sweep)'
        required: false

# Permissions are per job (review on #96): `route` runs on every failed run on every branch and
# holds only what labels and comments need; the OIDC/contents/actions write scopes exist only
# in `autofix`, which runs solely for agent branches.

concurrency:
  # One router per branch. GitHub keeps at most one running and one pending run per group; a
  # third failure arriving while one is pending replaces the pending one — the NEWEST failure
  # on the branch is always routed, an older one may be skipped (never an extra attempt).
  # Every sweep collapses to ONE group (not `github.run_id`, which is unique per run and so
  # serialized nothing): two overlapping sweeps would otherwise race between the marker check
  # and the dispatch and route the same failure twice (Copilot review on #113).
  # KNOWN bounded race (red-team rounds 2+3 on #120, accepted): an event-delivered route
  # (grouped by branch) and a sweep-dispatched route for the same failure (grouped by run id)
  # do not serialise, and both can pass handled() before either writes the marker. Both then
  # compute the SAME first-free label index, so the second addLabels is a set-level no-op:
  # the label COUNT under-counts — real attempts can EXCEED the bound by one per delivery
  # pair (it never over-blocks). One duplicate push or escalation comment is also possible.
  # A shared group cannot close it: the dispatch path does not know the branch until the
  # run starts.
  group: ci-failure-router-${{ github.event.workflow_run.head_branch || inputs.run_id || 'sweep' }}
  cancel-in-progress: false

jobs:
  # (b) Delivery backstop. Scans open agent PRs for a failed ci/security run at the current
  # head that the router never acted on, and dispatches the router for it. It decides
  # NOTHING about the failure: routing, bounds and escalation stay in `route`, reached
  # through the same code path as an event-delivered failure.
  sweep:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.run_id)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: write   # read the branch's runs; dispatch this workflow for the ones missed
    steps:
      - name: Dispatch the router for failures it never saw
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, {owner, repo, state: 'open', per_page: 100});
            let dispatched = 0;
            for (const pr of prs) {
              const has = n => pr.labels.some(l => l.name === n);
              if (!has('agent-authored') || has('needs-human')) continue;
              if (!/^task\//.test(pr.head.ref)) continue;
              if (pr.head.repo && pr.head.repo.full_name !== `${owner}/${repo}`) continue;
              // NO bound check here (red-team on #120 F1): the sweep re-delivers at EVERY
              // attempt count — at/above the bound, what `route` does with the delivery is
              // the exhaustion escalation, which needs a delivery backstop more than any
              // attempt does. `needs-human` above is the only stop; `route`'s marker keeps
              // re-delivery idempotent. Bounds and escalation stay in `route`, full stop.
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
                {owner, repo, branch: pr.head.ref, head_sha: pr.head.sha, per_page: 100});
              // Newest failed ci/security run at this head, and only if it is still the
              // latest attempt of that workflow (a later success means it was already fixed).
              const relevant = runs.filter(r => ['ci', 'security'].includes(r.name));
              const latestOf = new Map();
              for (const r of relevant) {
                const prev = latestOf.get(r.name);
                if (!prev || new Date(r.created_at) > new Date(prev.created_at)) latestOf.set(r.name, r);
              }
              const failed = [...latestOf.values()].filter(r => r.status === 'completed' && ['failure', 'timed_out', 'startup_failure'].includes(r.conclusion))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
              if (!failed) continue;
              const pass = failed.run_attempt || 1;
              const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: pr.number, per_page: 100});
              // Disabled markers don't count (` disabled -->`): while the knob is off the
              // route run they trigger is a marker-deduped no-op, and once the knob is
              // restored this re-dispatch is exactly the recovery path (red-team round 3).
              if (comments.some(c => (c.body || '').includes(`ci-failure-router sha=${pr.head.sha} pass=${pass}`) && !(c.body || '').includes(' disabled -->'))) continue;
              core.notice(`sweep: #${pr.number} has an unrouted ${failed.name} failure (run ${failed.id}, pass ${pass}) — dispatching the router`);
              await github.rest.actions.createWorkflowDispatch({owner, repo, workflow_id: 'ci-failure-router.yml',
                ref: context.payload.repository.default_branch, inputs: {run_id: String(failed.id)}});
              dispatched++;
            }
            core.notice(`sweep: dispatched ${dispatched} router run(s)`);

  route:
    # Only real failures, only same-repository heads: a fork's run never reaches a job that
    # carries secrets (GOVERNANCE.md §4b). Two entry paths, one decision procedure: the
    # workflow_run event, and a dispatch carrying the failed run's id (the sweep, or a human
    # routing a suppressed failure by hand).
    # Hard-failure conclusions all route (red-team round 2 on #120): timed_out and
    # startup_failure are failures a human must see — before this, they were REPORTED as
    # failures in the exhaustion list but never routed, so such a head sat in-progress,
    # holding a wip_cap slot, with no attempt, no comment and no escalation.
    if: >
      (github.event_name == 'workflow_run' && contains(fromJSON('["failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion) && github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.run_id)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write   # labels and comments on PRs go through the issues API but need this scope
      actions: read          # the failed run's jobs and the branch's failed runs
    outputs:
      route: ${{ steps.route.outputs.route }}
      pr: ${{ steps.route.outputs.pr }}
      attempt: ${{ steps.route.outputs.attempt }}
      branch: ${{ steps.route.outputs.branch }}
      sha: ${{ steps.route.outputs.sha }}
      run_id: ${{ steps.route.outputs.run_id }}
      run_name: ${{ steps.route.outputs.run_name }}
      run_url: ${{ steps.route.outputs.run_url }}
    steps:
      - uses: actions/checkout@v7
        # This is the DEFAULT branch — never PR content. workflow_run/workflow_dispatch
        # checkouts default to it anyway, but the bound lives in .github/agent-config.yml,
        # which an auto-fix agent CAN edit on its own branch (unlike .github/workflows/*),
        # so the property is pinned and stated, not inherited (review on #120; same
        # annotation as agent-approve/review-fix/agent-merge).
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github
          sparse-checkout-cone-mode: false
      - id: cfg
        run: |
          # Digit capture tolerant of quotes and an inline comment, and of NOTHING else
          # (red-team rounds 2+3 on #120): `0  # OFF` must disable, but `1e3`/`0x10`/`4.9`
          # must NOT truncate to a digit prefix — they fall through unmatched, emit nothing,
          # and the route script fails closed to 2. tail -1 matches YAML's last-key-wins on
          # a duplicate key and keeps single-line output structural.
          echo "max=$(sed -n 's/^auto_fix_max_attempts: *"\{0,1\}\(-\{0,1\}[0-9][0-9]*\)"\{0,1\}[[:space:]]*\(#.*\)\{0,1\}$/\1/p' .github/agent-config.yml | tail -n1)" >> "$GITHUB_OUTPUT"
      - name: Route the failure by branch
        id: route
        uses: actions/github-script@v7
        env:
          DISPATCH_RUN_ID: ${{ inputs.run_id }}
          MAX_ATTEMPTS: ${{ steps.cfg.outputs.max }}
        with:
          script: |
            const {owner, repo} = context.repo;
            // The failed run comes from the event when one was delivered, and from the API
            // when it was not (dispatch path — see the delivery note at the top of the file).
            // Everything downstream reads THIS object, never the event context, so both
            // paths route identically.
            const run = context.payload.workflow_run ||
              (await github.rest.actions.getWorkflowRun({owner, repo, run_id: Number(process.env.DISPATCH_RUN_ID)})).data;
            for (const [k, v] of Object.entries({branch: run.head_branch, sha: run.head_sha, run_id: run.id, run_name: run.name, run_url: run.html_url})) core.setOutput(k, v);
            const out = (route, extra = {}) => { core.setOutput('route', route); for (const [k, v] of Object.entries(extra)) core.setOutput(k, v); };
            // Same hard-failure set as the job guard and the sweep — the three lists must stay
            // identical or a conclusion becomes reportable-but-unroutable again (red-team round 2).
            if (!['failure', 'timed_out', 'startup_failure'].includes(run.conclusion)) { core.notice(`router: ${run.name} run ${run.id} concluded ${run.conclusion} — nothing to do`); return out('none'); }
            if (run.head_repository && run.head_repository.full_name !== `${owner}/${repo}`) { core.notice(`router: run ${run.id} is from fork ${run.head_repository.full_name} — never touched (GOVERNANCE.md §4b)`); return out('none'); }
            const branch = run.head_branch;
            const runUrl = run.html_url;
            const routerRun = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            // Where it failed: first failed job and its first failed step (for humans and for the agent prompt).
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {owner, repo, run_id: run.id, per_page: 100});
            const job = jobs.find(j => j.conclusion === 'failure');
            const step = job && (job.steps || []).find(s => s.conclusion === 'failure');
            const where = job ? `job **${job.name}**${step ? `, step **${step.name}**` : ''}` : 'no failed job reported (cancelled or infrastructure failure)';
            // One router action per commit AND pass: a second failed workflow on the same sha (ci then security)
            // is not a second attempt and not a second comment, but a re-run of the same commit (`gh run rerun`
            // after an "environmental" diagnosis) is a new run_attempt and counts as the next attempt — otherwise
            // a misdiagnosed rerun would be swallowed and the bound never reached (red-team on #96, 2026-08-30).
            // The marker is invisible in rendered Markdown.
            const pass = run.run_attempt || 1;
            const marker = `<!-- ci-failure-router sha=${run.head_sha} pass=${pass} run=${run.id} -->`;
            // Disabled markers (` disabled -->`) do NOT count as handled: they exist only to
            // quiet the sweep WHILE the knob is off — once restored, the failure must route
            // again (red-team round 3 on #120: the plain marker outlived the disabled state
            // and closed the delivery backstop permanently).
            const handled = async n => (await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: n, per_page: 100}))
              .some(c => (c.body || '').includes(`ci-failure-router sha=${run.head_sha} pass=${pass}`) && !(c.body || '').includes(' disabled -->'));

            // (b) main: one open ci-failure issue per workflow; agent-triage takes it from there.
            if (branch === 'main') {
              const open = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', labels: 'ci-failure', per_page: 100});
              const dup = open.find(i => i.title.startsWith(`CI failure on main: ${run.name} `));
              if (dup) { core.notice(`router: open ci-failure issue #${dup.number} already covers workflow ${run.name} — not filing another (run ${runUrl})`); return out('main'); }
              const created = await github.rest.issues.create({owner, repo,
                title: `CI failure on main: ${run.name} run ${run.id}`, labels: ['ci-failure', 'task'],
                body: `Workflow **${run.name}** failed on \`main\` at ${run.head_sha}: ${runUrl}\n\nFirst failure: ${where}.\n\nFiled by ci-failure-router (${routerRun}); \`ci-failure\` hands it to agent-triage. Close it via the fixing PR (\`Closes #n\`).`});
              core.notice(`router: filed #${created.data.number} for ${run.name} on main`);
              return out('main');
            }

            // Which PR carries this branch (same-repository heads only — see the job guard).
            const prs = await github.rest.pulls.list({owner, repo, state: 'open', head: `${owner}:${branch}`, per_page: 5});
            const pr = prs.data[0];
            const agentPr = pr && /^task\//.test(branch) && pr.labels.some(l => l.name === 'agent-authored');

            // (a) agent branch: bounded auto-fix. The bound is the labels on the PR, nothing else.
            if (agentPr) {
              if (pr.labels.some(l => l.name === 'needs-human')) { core.notice(`router: #${pr.number} already needs-human — nothing to do (run ${runUrl})`); return out('none'); }
              if (await handled(pr.number)) { core.notice(`router: sha ${run.head_sha} pass ${pass} on #${pr.number} already handled — one attempt per commit and pass`); return out('none'); }
              // Bound = agent-config auto_fix_max_attempts (ruling 2026-09-03: 4; was 2).
              // Strict parse (red-team on #120 F2/F7): digits only, so '1e3'/'0x10' are
              // unreadable, and unreadable fails closed to the previously ruled 2. A value
              // < 1 DISABLES auto-fix — the off-switch every sibling knob documents
              // (review_fix_max_attempts, auto_*_max_tier) — instead of silently meaning 2.
              // An upper clamp of 10 enforces the ruling's rejection of "unlimited".
              // Attempts are the auto-fix-<n> labels; nothing resets them but a human.
              const rawMax = /^-?\d+$/.test(process.env.MAX_ATTEMPTS || '') ? Number(process.env.MAX_ATTEMPTS) : null;
              if (rawMax !== null && rawMax < 1) {
                core.notice(`router: auto_fix_max_attempts=${rawMax} — auto-fix disabled, not acting on #${pr.number}`);
                // DISTINCT disabled marker (` disabled` token): handled() and the sweep skip
                // it, so restoring the knob lets the next sweep re-route this failure
                // (red-team round 3). While disabled, the sweep re-dispatches ~2-hourly and
                // this branch no-ops against its own marker — bounded Actions noise, zero
                // comment spam. NOTE (review round 3, recorded in GOVERNANCE §4): disabling
                // stops escalation and claim release too — the PR keeps `in-progress`; the
                // disable window is operator-owned.
                const dMarker = marker.replace(' -->', ' disabled -->');
                const already = (await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: pr.number, per_page: 100}))
                  .some(c => (c.body || '').includes(dMarker));
                if (!already) await github.rest.issues.createComment({owner, repo, issue_number: pr.number,
                  body: `${dMarker}\n⏸️ **${run.name}** failed at ${run.head_sha.slice(0, 7)} (${where}) — ${runUrl}\n\nAuto-fix is disabled (\`auto_fix_max_attempts: ${rawMax}\`); the router is not acting, and this PR keeps its \`in-progress\` claim — release it by hand if you are parking this work. Restoring the knob re-routes this failure on the next sweep.`});
                return out('none');
              }
              const maxAttempts = rawMax === null ? 2 : Math.min(rawMax, 10);
              if (rawMax === null) core.notice('auto_fix_max_attempts unreadable — using 2 (fail closed)');
              else if (rawMax > 10) core.notice(`auto_fix_max_attempts=${rawMax} clamped to 10`);
              const attempts = pr.labels.filter(l => /^auto-fix-\d+$/.test(l.name)).length;
              if (attempts < maxAttempts) {
                // First FREE index, not attempts+1 (red-team on #120 F5): labels are a set,
                // and a human removing auto-fix-1 to grant another go leaves {2,3,4} — a
                // re-write of auto-fix-4 would be a no-op, the count would never advance,
                // and the bound would be unreachable (unbounded auto-fix). A free-slot
                // write advances the count every time.
                let n = 1; while (pr.labels.some(l => l.name === `auto-fix-${n}`)) n++;
                await github.rest.issues.addLabels({owner, repo, issue_number: pr.number, labels: [`auto-fix-${n}`]});
                await github.rest.issues.createComment({owner, repo, issue_number: pr.number,
                  body: `${marker}\n🔧 **${run.name}** failed at ${run.head_sha.slice(0, 7)} (${where}) — ${runUrl}\n\nAuto-fix attempt ${attempts + 1} of ${maxAttempts} starting on this branch (router run ${routerRun}). Disable the \`ci-failure-router\` workflow or set \`auto_fix_max_attempts: 0\` to stop it.`});
                return out('autofix', {pr: pr.number, attempt: attempts + 1});
              }
              // Exhausted: release the claim on the PR and on the issues this PR actually closes (its
              // `Closes/Fixes/Resolves #n` — the branch name's digits only as a fallback), then escalate.
              // ALL non-successful runs accounted for: up to 10 listed, an explicit tail beyond
              // that, and the fetch window disclosed when it clips — never a silent truncation
              // presented as a complete list (maintainer report on #118, 2026-09-03: 3 of 4
              // failed runs shown, nothing marking the cut). One un-paginated call (Copilot on
              // #120), filtered HERE rather than by the API's single-conclusion `status` param,
              // so timed_out/startup_failure/cancelled runs are listed too (red-team F6 —
              // startup_failure is exactly what a broken workflow edit by an auto-fix agent
              // produces, and the human picking this up needs to see it).
              const fr = await github.rest.actions.listWorkflowRunsForRepo({owner, repo, branch, per_page: 100});
              const bad = fr.data.workflow_runs.filter(r => r.status === 'completed' && !['success', 'skipped'].includes(r.conclusion));
              // Hard failures before noise (review round 3 on #120): ci.yml cancels in-progress
              // runs on every non-main push, so `cancelled` is the most-produced conclusion on
              // exactly the branches this path serves — newest-first alone can fill all 10 slots
              // with cancellations and push the real failures below the cap. Stable sort keeps
              // newest-first within each class.
              const rank = c => (['failure', 'timed_out', 'startup_failure'].includes(c) ? 0 : 1);
              bad.sort((a, b) => rank(a.conclusion) - rank(b.conclusion));
              const shown = bad.slice(0, 10);
              // Every count is scoped to what was actually fetched (review on #120: five
              // workflows fire per push, so exhaustion is exactly when a small window clips —
              // a branch-wide-sounding number computed inside a window is the same quiet
              // evidence-narrowing this comment exists to remove).
              const links = (shown.map(r => `- ${r.name} run [${r.id}](${r.html_url}) — ${r.conclusion}`).join('\n') || `- ${run.name} run [${run.id}](${runUrl})`)
                + (bad.length > shown.length ? `\n- … and ${bad.length - shown.length} more non-successful run(s) in the newest ${fr.data.workflow_runs.length} runs fetched` : '')
                + (fr.data.total_count > fr.data.workflow_runs.length ? `\n- (window: newest ${fr.data.workflow_runs.length} of ${fr.data.total_count} runs on this branch — older runs not scanned)` : '');
              const closes = [...new Set([...(pr.body || '').matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map(x => Number(x[1])))];
              const m = branch.match(/^task\/(\d+)$/);
              const issues = closes.length ? closes : (m ? [Number(m[1])] : []);
              // Only "label already absent" (404) is a non-event; any other API failure is reported, never
              // claimed as done (red-team on #96: a swallowed 5xx left `in-progress` + `needs-human` together).
              const attempt = async (what, fn) => { try { await fn(); return null; } catch (e) { return e.status === 404 ? null : `${what} (${e.status || ''} ${e.message || e})`; } };
              const problems = [], released = [];
              for (const t of [pr.number, ...issues]) {
                const r = await attempt(`could NOT release \`in-progress\` on #${t}`, () => github.rest.issues.removeLabel({owner, repo, issue_number: t, name: 'in-progress'}));
                if (r) problems.push(r); else released.push(`#${t}`);
                const a = await attempt(`could NOT apply \`needs-human\` on #${t}`, () => github.rest.issues.addLabels({owner, repo, issue_number: t, labels: ['needs-human']}));
                if (a) problems.push(a);
              }
              const status = [`\`in-progress\` released on ${released.join(', ')}`, ...problems.map(p => `⚠️ ${p} — do it by hand`)].join('; ');
              await github.rest.issues.createComment({owner, repo, issue_number: pr.number,
                body: `${marker}\n🛑 Auto-fix **exhausted** after ${attempts} attempts (configured bound ${maxAttempts}); CI is still failing (${where}). Escalated \`needs-human\`${issues.length ? ` on ${issues.map(n => `#${n}`).join(', ')}` : ''}; ${status}.\n\nTriggering run: **${run.name}** [${run.id}](${runUrl}) — always listed, even when newer failures crowd the window (red-team round 3 on #120).\n\nNon-successful runs on this branch:\n${links}`});
              // The PR's own needs-human is the escalation signal humans watch: if it could not be applied, fail loudly.
              if (problems.some(p => p.includes(`\`needs-human\` on #${pr.number}`))) throw new Error(`router: escalation incomplete — ${problems.join('; ')}`);
              return out('exhausted', {pr: pr.number});
            }

            // (c) human branch (or task/* without agent authorship): one comment per commit, never a push or a label.
            if (!pr) { core.notice(`router: ${branch} has no open PR — nothing to do (run ${runUrl})`); return out('none'); }
            if (await handled(pr.number)) { core.notice(`router: sha ${run.head_sha} pass ${pass} on #${pr.number} already commented`); return out('none'); }
            await github.rest.issues.createComment({owner, repo, issue_number: pr.number,
              body: `${marker}\nℹ️ **${run.name}** failed at ${run.head_sha.slice(0, 7)}: ${where} — ${runUrl}`});
            return out('human', {pr: pr.number});

  autofix:
    needs: route
    if: needs.route.outputs.route == 'autofix'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write   # anthropics/claude-code-action exchanges an OIDC token for its App token (found 2026-08-29)
      contents: write
      issues: write
      pull-requests: write
      actions: write    # `gh run rerun` for environmental failures; failed-run logs
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.route.outputs.branch }}
          fetch-depth: 0
          # (a) from docs/OPEN-QUESTIONS.md 2026-08-31: with credentials persisted, the
          # agent's `git push` used GITHUB_TOKEN — which made the resulting `synchronize`
          # actor `github-actions` AND suppressed workflow_run delivery for the CI run it
          # started, so the router never saw its own attempt's failure and attempt 2 could
          # not fire. Unpersisted, the push uses the Claude App token and chaining works.
          persist-credentials: false
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Toolchain (so the agent can run the pipeline)
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          pip install jinja2 pyyaml pytest
      - name: Claude Code — diagnose and fix on the agent's branch
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude,github-actions   # workflow_run's actor is whoever caused the failed run: the Claude App for agent pushes
          prompt: |
            You are the CI auto-fix agent. Read CLAUDE.md and
            docs/OPERATING-POLICY.md first and stay strictly within agent
            permissions. You are on branch
            ${{ needs.route.outputs.branch }} of PR
            #${{ needs.route.outputs.pr }} (auto-fix attempt
            ${{ needs.route.outputs.attempt }} of the configured bound). Workflow
            "${{ needs.route.outputs.run_name }}" run
            ${{ needs.route.outputs.run_id }} failed on commit
            ${{ needs.route.outputs.sha }}:
            ${{ needs.route.outputs.run_url }}
            1. Fetch the failure: `gh run view --log-failed ${{ needs.route.outputs.run_id }}`.
               Also `gh run list --commit ${{ needs.route.outputs.sha }} --status failure`
               in case another workflow failed on the same commit, and read
               its failed logs too.
            2. Diagnose the root cause. Fix it ON THIS BRANCH only — never
               main, never another branch. Where the failure reveals a
               missing test, work TDD: add the failing test first, then the
               fix. Never weaken, skip or delete a test, assertion, scenario,
               gate threshold or policy constant; never touch tests/vectors/
               or protocol/omgp-protocol.yaml — if the fix needs any of
               those, change nothing, explain why in a PR comment, and stop.
            3. Run ./pipeline.sh (the stages the failure names, then the full
               local set) until green BEFORE pushing. Commit with
               `Refs #<task issue>` and push to this branch — the push
               re-runs CI.
            4. Comment on the PR with `gh pr comment`: root cause, what
               changed, and the evidence, each claim labelled (demonstrated
               by <named test/stage>, assumed, or NOT EXAMINED) per CLAUDE.md
               rule 11.
            If the failure is environmental or flaky (runner, network,
            toolchain download, a timeout with no code change involved),
            change no code: say so in a PR comment with the evidence, and
            re-run it with `gh run rerun ${{ needs.route.outputs.run_id }} --failed`.
          claude_args: |
            --allowedTools "Bash(./pipeline.sh*),Bash(git*),Bash(gh run view*),Bash(gh run list*),Bash(gh run rerun*),Bash(gh pr comment*),Bash(gh pr view*),Edit,Read,Write,Grep,Glob"

      - name: Record an attempt that did not complete
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const pr = Number('${{ needs.route.outputs.pr }}');
            await github.rest.issues.createComment({...context.repo, issue_number: pr,
              body: `⚠️ Auto-fix attempt ${{ needs.route.outputs.attempt }} did not complete (router run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}). It still counts toward the attempt bound.`});
