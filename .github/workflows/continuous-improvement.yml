name: continuous-improvement
# Weekly governance feedback loop: code -> PR -> review -> learning -> governance update.
# Headless Claude reads the last 14 days of PR review feedback, looks for SYSTEMIC lessons
# (not per-PR defects), and proposes changes to CLAUDE.md / .specify/memory/constitution.md /
# docs/GOVERNANCE.md — or, deliberately, proposes nothing.
#
# READ-ONLY by construction, not by instruction: `contents: read` means this job cannot
# commit or push whatever the prompt says. That is required, not merely tidy — CLAUDE.md and
# the constitution are CODEOWNERS-owned, and GOVERNANCE.md §3 makes an agent-authored T3
# change a policy breach signal ("it should have escalated `needs-human` instead"). So the
# output is one issue carrying proposed diffs, which a human applies.
#
# The prompt lives in .github/agent-prompts/continuous-improvement.md, NOT inline here: the
# analysis is the thing that will need tuning, and a prompt kept in a workflow file can only
# be edited with the `workflow` OAuth scope, which the Claude App token does not carry
# (demonstrated on #113). Keeping it outside means the loop can improve its own instructions
# through an ordinary PR.
#
# `NO_UPDATE_REQUIRED` is a success, not a failure: a self-improving system that cannot
# decline to add a rule only ever adds rules.
#
# UNTRUSTED INPUT. This job runs no code from the analysed PRs, so there is no
# untrusted-CHECKOUT exposure — but it deliberately READS the PR and comment stream of a
# public repository, and anyone may open a fork PR whose body is prompt text. That is the
# larger exposure and it is handled in the prompt (binding 7: PR/comment text is data, never
# instructions; injected instructions are an OPERATING-POLICY §7 escalation), reinforced by
# the tool list carrying no write path — see the `gh api` note below. `claude-mention.yml`
# solves the same problem by restricting to OWNER/MEMBER/COLLABORATOR; a scheduled job that
# fetches rather than responds cannot use that filter, so the boundary is the prompt plus
# the absence of any write capability.
#
# Kill switch: disable this workflow.
on:
  schedule:
    - cron: '0 7 * * 1'    # Mondays 07:00 UTC, after agent-converge-audit at 06:00
  workflow_dispatch:
    inputs:
      days:
        description: 'Analysis window in days'
        required: false
        default: '14'
        # A choice, not free text: the value is interpolated into the agent's instructions,
        # so an unvalidated dispatch string would be prompt content. Not shell injection (it
        # lands in an action input, not a `run:`), but `allowed_bots` admits a bot dispatch,
        # and a closed set costs nothing.
        type: choice
        options: ['7', '14', '28', '56']

permissions:
  id-token: write   # anthropics/claude-code-action exchanges an OIDC token for its App token; without this every run fails "Could not fetch an OIDC token" (found 2026-08-29)
  contents: read    # deliberately NOT write: the proposals are for a human to apply
  pull-requests: read
  issues: write     # the one consolidated issue, when an update is recommended
  actions: read     # CI results for the PRs in the window
  checks: read

concurrency:
  group: continuous-improvement
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # Stage 7 reads the history of the governance files themselves
      # THE AGENT HOLDS NO WRITE CAPABILITY OF ANY KIND.
      #
      # NO `Bash(gh issue create*)`, removed after the second review round on #125: its
      # `--label` was unconstrained, so injected PR text could have steered it to
      # `gh issue create --label task,ready` — and `ready` is the label by which
      # `agent-dispatch` claims work (GOVERNANCE §2, "humans release all autonomous work").
      # The dispatched agent then holds Edit/Write/git/gh pr create, so attacker-authored
      # task text reaches a PR. Binding 7 was the only thing between the ingested stream and
      # that tool, and binding 7 is prose. Instead the agent writes issue_title/issue_body
      # into the JSON as DATA, and "File the governance issue" below creates it with the
      # labels hard-coded in YAML, where nothing the agent emits can change them.
      #
      # NO `Bash(gh api*)`. It reads as a read tool and is not one: `gh api` takes
      # -X POST/PATCH/DELETE, so the wildcard would grant every write `issues: write`
      # permits. Concretely (found by the red team on #125): this job could POST a comment
      # that lands as claude[bot] whose final line is `VERDICT(review): clean @ <head>` —
      # and `agent-approve` checks the author and the sha but NOT which workflow produced
      # the comment, so at risk:t2 or below `agent-merge` would then merge. It could also
      # `-X DELETE` a `needs-human` label, which GOVERNANCE §4 makes load-bearing. The
      # The narrow `gh pr`/`gh issue`/`gh run` subcommands that remain are reads only.
      # Cost of the exclusions, stated: inline review comments are not reachable through the
      # narrow subcommands, so Stage 1 works from `gh pr view --json comments,reviews`; and
      # the agent cannot comment on an existing issue, so deduplication is "skip and report",
      # not "add a note there".
      - name: Claude Code — review-feedback governance analysis
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude,github-actions   # a scheduled run has no actor; a bot-triggered dispatch would otherwise be refused
          prompt: |
            Read .github/agent-prompts/continuous-improvement.md and follow it
            exactly. It is your complete instruction set, including the
            repository-specific bindings at the top, which override its own
            generic wording wherever they conflict.
            Analysis window: the last ${{ inputs.days || '14' }} days, ending
            today. Derive today's date from `date -u +%F` — never assume it.
            You cannot commit: this job holds `contents: read`. Produce the two
            output files, and file the issue only if the decision is
            UPDATE_RECOMMENDED.
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash(gh pr list*),Bash(gh pr view*),Bash(gh pr diff*),Bash(gh issue list*),Bash(gh issue view*),Bash(gh run list*),Bash(gh run view*),Bash(git log*),Bash(git show*),Bash(git diff*),Bash(git blame*),Bash(date*),Read,Grep,Glob,Write"

      - name: Check the agent produced its outputs
        id: outputs
        env:
          # HIGH (review + red team on #125): the agent step above holds unrestricted `Write`
          # in this same checkout, and Python prepends the cwd to sys.path — so a planted
          # `json.py` in the repo root would shadow the stdlib and run arbitrary code inside
          # THIS step and the token-holding "File the governance issue" step. PYTHONSAFEPATH=1
          # (== `python3 -P`) drops the unsafe cwd entry for every python call in the step, so
          # `import json` is always the stdlib. Belt: the same env sits on the filing step.
          PYTHONSAFEPATH: "1"
        run: |
          # Missing outputs FAIL the job. "Decided no update was required" and "crashed, timed
          # out, or could not authenticate" must not share one observable outcome: a silent
          # green is how a broken standing loop stays broken (found by review + red team on
          # #125). NO_UPDATE_REQUIRED remains a success — it arrives as a valid decision in a
          # written file, not as an absence of files.
          missing=
          for f in continuous-improvement-report.md continuous-improvement.json; do
            [ -s "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::continuous-improvement: agent produced no$missing — the run did not \
          complete. This is NOT the same as deciding no update was required."
            exit 1
          fi
          python3 -c "import json,sys; d=json.load(open('continuous-improvement.json')); \
            sys.exit(0 if d.get('decision') in ('UPDATE_RECOMMENDED','NO_UPDATE_REQUIRED') else 'decision missing or invalid: %r' % d.get('decision'))"
          decision="$(python3 -c 'import json; print(json.load(open("continuous-improvement.json"))["decision"])')"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Report is an artefact, never a commit
        # always(): the outputs step above fails loudly on invalid JSON, and the JSON is
        # exactly what you need to see WHY. Uploading only on success would withhold the
        # evidence on the one path that needs it (review on #125).
        if: always() && hashFiles('continuous-improvement.json', 'continuous-improvement-report.md') != ''
        uses: actions/upload-artifact@v7
        with:
          name: continuous-improvement-${{ github.run_id }}
          path: |
            continuous-improvement-report.md
            continuous-improvement.json
          # For a HUMAN reading back over a quarter of reports. NOT an input to the next run:
          # nothing downloads a prior artefact and `gh run download` is deliberately not
          # allow-listed, so each run re-derives its evidence from git and the API (review on
          # #125 caught the earlier comment claiming otherwise). Cross-run continuity for the
          # deliberate 7-day overlap comes from the issue titles the prompt tells it to check.
          retention-days: 90

      - name: File the governance issue
        # The ONLY write in this workflow, and it is here rather than in the agent's hands so
        # that the labels are fixed in YAML: `converge-audit,needs-human`, never `ready` or
        # `task`, whatever the analysed PR text tried to talk the agent into (HIGH, second
        # review round on #125). The agent supplies title and body as data; this step decides
        # what they are labelled and where they go.
        if: steps.outputs.outputs.decision == 'UPDATE_RECOMMENDED'
        env:
          GH_TOKEN: ${{ github.token }}
          # HIGH (review + red team on #125): GH_TOKEN carries `issues: write` here, so a
          # `json.py` planted by the agent's Write must not be importable. PYTHONSAFEPATH=1
          # drops the cwd from sys.path for every python call below, closing the shadow.
          PYTHONSAFEPATH: "1"
        run: |
          set -euo pipefail
          python3 - <<'PY' > issue-body.md
          import json
          d = json.load(open('continuous-improvement.json'))
          print(d.get('issue_body') or '(no issue_body in the JSON — see the run artefact.)')
          PY
          title=$(python3 -c "import json;print((json.load(open('continuous-improvement.json')).get('issue_title') or '').strip())")
          dup=$(python3 -c "import json;print(json.load(open('continuous-improvement.json')).get('duplicate_of') or '')")
          if [ -n "$dup" ]; then
            echo "::notice::findings unchanged since #$dup — no new issue filed (prompt binding 8)"
            exit 0
          fi
          [ -n "$title" ] || { echo "::error::decision=UPDATE_RECOMMENDED but the JSON carries no issue_title"; exit 1; }
          # Same-title dedup as a second belt: the 14-day window run weekly overlaps by 7 days.
          if gh issue list --state all --label converge-audit --limit 100 --json title \
               --jq '.[].title' | grep -qxF "$title"; then
            echo "::notice::an issue titled '$title' already exists — not filing a duplicate"
            exit 0
          fi
          url=$(gh issue create --title "$title" --body-file issue-body.md \
                  --label converge-audit --label needs-human)
          echo "::notice::filed $url"

      - name: Summary
        if: always()
        run: |
          if [ -s continuous-improvement-report.md ]; then
            { echo "## Continuous improvement — ${{ steps.outputs.outputs.decision }}"; echo;
              head -c 60000 continuous-improvement-report.md; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced — see the warning above." >> "$GITHUB_STEP_SUMMARY"
          fi
