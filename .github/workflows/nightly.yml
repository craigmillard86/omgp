name: nightly
on:
  schedule:
    - cron: '30 2 * * *'      # 02:30 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write               # failures file an issue instead of vanishing

jobs:
  long-fuzz:
    name: extended fuzzing (30 min per target)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Deps
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build clang
          pip install jinja2 pyyaml
      - name: Build + long fuzz
        run: |
          ./pipeline.sh codegen build
          ./tools/fuzz-smoke.sh 1800   # real libFuzzer targets since feature 001; exits 1 without clang
      - name: Upload fuzz corpus/crashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ github.run_id }}
          path: build/fuzz/**
          if-no-files-found: ignore

  mutation:
    name: mutation testing (weekly, Mondays)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && format('{0}', github.run_number) != '')
    steps:
      - uses: actions/checkout@v4
      - name: Gate to Mondays for the scheduled trigger
        id: day
        run: echo "run=$([ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.day.outputs.run == 'yes'
        with: {python-version: '3.12'}
      - name: Deps (clang + pinned Mull, as in ci.yml deep-verify)
        if: steps.day.outputs.run == 'yes'
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build clang
          pip install jinja2 pyyaml
          wget -q https://github.com/mull-project/mull/releases/download/0.34.0/Mull-18-0.34.0-LLVM-18.1.3-ubuntu-amd64-24.04.deb
          sudo apt-get install -y ./Mull-18-0.34.0-LLVM-18.1.3-ubuntu-amd64-24.04.deb
          mull-runner-18 -version
      # Whole-tree run: the kill rate is a trend (ruling 2026-08-29), never a gate — the
      # job fails only if Mull is missing, produces no report, or a label is malformed.
      - name: Mutation run (whole tree, trend only)
        if: steps.day.outputs.run == 'yes'
        run: ./tools/mutate.sh --require --trend-log build/mutate/trend.jsonl
      - name: Upload mutation report + trend line
        if: steps.day.outputs.run == 'yes' && always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ github.run_id }}
          path: |
            build/mutate/report.json
            build/mutate/trend.jsonl
          if-no-files-found: ignore

  file-issue-on-failure:
    needs: [long-fuzz, mutation]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Nightly CI failure — run ${context.runId}`,
              body: `A nightly job failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci', 'nightly-failure']
            });
