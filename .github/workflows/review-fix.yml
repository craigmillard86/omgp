name: review-fix
# Review-finding auto-resolution (companion to ci-failure-router's CI-failure loop).
# Gap this closes: claude-review and red-team are READ-ONLY — they post findings and a
# machine-readable verdict, and the ONLY consumer of that verdict (agent-approve) merely
# WITHHOLDS approval. A green-CI agent PR carrying review findings therefore stalled
# forever with no agent able to act on it. This workflow is the missing edge: findings ->
# bounded fix attempt on the agent's own branch -> new push -> re-review.
#
# The trigger is `issue_comment` DELIBERATELY, for the same reason agent-approve uses it:
# those runs use the DEFAULT-BRANCH workflow definition, so a same-repo PR can never
# rewrite this loop's own bounds in its own diff.
#
# Scope policy (ruled 2026-09-05, #134; supersedes the 2026-09-02 severity policy): fix the
# BLOCKING findings and no others. BLOCKING = a defect in the changed code, a security hole,
# a weakened/narrowed test, a spec divergence, an unmet acceptance criterion of the linked
# issue, or a false claim the PR makes. A FOLLOW-UP finding — a real improvement or
# pre-existing gap OUTSIDE the linked issue's acceptance criteria — is NOT fixed here:
# growing a PR past its criteria is what turned #128 into five rounds of accretion. The
# reviewer proposes those as issues; this loop leaves them. Because the review verdict is
# `clean` iff there are no BLOCKING findings, a PR whose only findings are FOLLOW-UPs is
# auto-approvable (the merge stays human for T3 / CODEOWNERS paths per GOVERNANCE.md §1).
# Fixing a blocking finding MAY shrink the diff (drop an out-of-scope claim or its
# machinery), not only add code.
#
# Bound — `review_fix_max_attempts` attempts per PR (.github/agent-config.yml; 4 since the
# 2026-09-03 ruling), as labels `review-fix-1..N`, at most one per head commit. Nothing
# resets the labels but a human. Exhaustion escalates `needs-human` exactly as the CI router
# does. Kill switch: `review_fix_max_attempts: 0`, or disable this workflow.
# The `gate` script is executed verbatim by tests/workflows/review_fix_harness.js.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to act on'
        required: true

concurrency:
  group: review-fix-${{ github.event.issue.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  gate:
    # Cheap pre-filter so the vast majority of comments never start a job body. The real
    # decision (agent-authored, bounds, verdict-at-head) is the script's, and every
    # unresolved condition fails CLOSED — no fix attempt.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       github.event.comment.user.login == 'claude[bot]' &&
       contains(github.event.comment.body, 'VERDICT('))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write   # NOT reducible to read (raised by Copilot on #113): this job WRITES to the
                             # PR — attempt labels, the marker comment, and the needs-human/in-progress
                             # label moves on exhaustion. Labels and comments on a pull request go
                             # through the issues API but are governed by the pull-requests scope, which
                             # is why ci-failure-router's `route` job carries the same pair.
    outputs:
      go: ${{ steps.gate.outputs.go }}
      pr: ${{ steps.gate.outputs.pr }}
      branch: ${{ steps.gate.outputs.branch }}
      head: ${{ steps.gate.outputs.head }}
      attempt: ${{ steps.gate.outputs.attempt }}
      kinds: ${{ steps.gate.outputs.kinds }}
      closes: ${{ steps.gate.outputs.closes }}   # the body's Closes/Fixes/Resolves set before the run, `none` if empty (#463)
    steps:
      - uses: actions/checkout@v7   # issue_comment: this is the DEFAULT branch — never PR content
      - name: Decide whether a bounded fix attempt is due
        id: gate
        uses: actions/github-script@v7
        env:
          DISPATCH_PR: ${{ inputs.pr }}
        with:
          script: |
            const fs = require('fs');
            const {owner, repo} = context.repo;
            // The shared detector module, from THIS job's default-branch checkout: this job runs no
            // Claude step, so its workspace is trusted. Unreadable => the gate fails, loudly (#463).
            const noop = require(`${process.env.GITHUB_WORKSPACE}/tools/ci/agent-noop.js`);
            const out = (go, extra = {}) => { core.setOutput('go', go); for (const [k, v] of Object.entries(extra)) core.setOutput(k, v); };
            // The bound comes from the DEFAULT-branch config, so it can be retuned without a
            // workflow-scope push. Unreadable or absent => no attempt (fail closed).
            let MAX;
            try {
              MAX = Number.parseInt(/^review_fix_max_attempts: *(\d+)/m.exec(
                fs.readFileSync(`${process.env.GITHUB_WORKSPACE || '.'}/.github/agent-config.yml`, 'utf8'))[1], 10);
            } catch (e) { core.notice(`review-fix: review_fix_max_attempts unreadable (${e.message}) — no attempt (fail closed)`); return out('no'); }
            if (!Number.isInteger(MAX) || MAX < 1) { core.notice(`review-fix: review_fix_max_attempts=${MAX} — the loop is disabled`); return out('no'); }
            const ATTEMPT_LABELS = Array.from({length: MAX}, (_, i) => `review-fix-${i + 1}`);
            // `Number('')` is 0, not NaN: a blank dispatch input must fail closed, never act on
            // PR #0 (Copilot review on #113 — the same class of bug the merge harness caught).
            const raw = String(context.payload.issue ? context.payload.issue.number : (process.env.DISPATCH_PR || '')).trim();
            const number = Number(raw);
            if (!raw || !Number.isInteger(number) || number <= 0) { core.notice('review-fix: no usable PR number — nothing to do'); return out('no'); }
            if (context.payload.issue && !context.payload.issue.pull_request) { core.notice('review-fix: comment is on a plain issue — untouched'); return out('no'); }
            if (context.payload.comment) {
              const c = context.payload.comment;
              if (!c.user || c.user.login !== 'claude[bot]' || !(c.body || '').includes('VERDICT(')) {
                core.notice('review-fix: trigger comment is not a claude[bot] verdict — untouched'); return out('no');
              }
            }
            // Fresh PR state from the API — never from any checkout.
            const pr = (await github.rest.pulls.get({owner, repo, pull_number: number})).data;
            if (pr.state !== 'open') { core.notice(`review-fix: #${number} is ${pr.state} — nothing to do`); return out('no'); }
            if (pr.head.repo && pr.head.repo.full_name !== `${owner}/${repo}`) { core.notice(`review-fix: #${number} is from fork ${pr.head.repo.full_name} — never touched (GOVERNANCE.md §4b)`); return out('no'); }
            const has = n => pr.labels.some(l => l.name === n);
            if (!has('agent-authored')) { core.notice(`review-fix: #${number} is not agent-authored — human PRs are never pushed to`); return out('no'); }
            if (has('needs-human')) { core.notice(`review-fix: #${number} already needs-human — nothing to do`); return out('no'); }
            if (!/^task\//.test(pr.head.ref)) { core.notice(`review-fix: head ${pr.head.ref} is not a task/* branch — untouched`); return out('no'); }
            const head = pr.head.sha;

            // Verdicts: only from claude[bot], only as the FINAL non-empty line, only at the
            // CURRENT head (same rule as agent-approve — a verdict token quoted mid-comment,
            // or one left over from an older head, must never trigger a push).
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number: number, per_page: 100});
            const verdictOf = kind => {
              const re = new RegExp(`^VERDICT\\(${kind}\\):\\s*(clean|findings)\\s*@\\s*${head}$`);
              let latest = null;
              for (const cm of comments) {
                if (!cm.user || cm.user.login !== 'claude[bot]') continue;
                const lines = (cm.body || '').trim().split('\n');
                const hit = re.exec(lines[lines.length - 1].trim());
                if (hit) latest = hit[1];
              }
              return latest;
            };
            const kinds = ['review', 'red-team'].filter(k => verdictOf(k) === 'findings');
            if (!kinds.length) { core.notice(`review-fix: no findings verdict at ${head.slice(0, 7)} — nothing to fix`); return out('no'); }

            // One attempt per head commit: a red-team findings verdict arriving after a review
            // one on the SAME commit is not a second attempt (mirrors the router's sha marker).
            // The marker is invisible in rendered Markdown.
            const marker = `<!-- review-fix sha=${head} -->`;
            if (comments.some(c => (c.body || '').includes(`review-fix sha=${head}`))) {
              core.notice(`review-fix: ${head.slice(0, 7)} already attempted — one attempt per commit`); return out('no');
            }
            const attempts = ATTEMPT_LABELS.filter(l => has(l)).length;
            if (attempts >= MAX) {
              // Exhausted: release the claim on the PR and on the issues it closes, then
              // escalate — the same shape as ci-failure-router's exhaustion path, including
              // its rule that only a 404 ("label already absent") is a non-event.
              // Same-repo closing references only (cross-repo ones cannot be released here), from the
              // shared closingRefs — the one implementation of GitHub's auto-close forms (#463).
              const closes = noop.closingIssues(pr.body || '', owner, repo);
              const m = pr.head.ref.match(/^task\/(\d+)$/);
              const issues = closes.length ? closes : (m ? [Number(m[1])] : []);
              const attempt = async (what, fn) => { try { await fn(); return null; } catch (e) { return e.status === 404 ? null : `${what} (${e.status || ''} ${e.message || e})`; } };
              const problems = [], released = [];
              for (const t of [number, ...issues]) {
                const r = await attempt(`could NOT release \`in-progress\` on #${t}`, () => github.rest.issues.removeLabel({owner, repo, issue_number: t, name: 'in-progress'}));
                if (r) problems.push(r); else released.push(`#${t}`);
                const a = await attempt(`could NOT apply \`needs-human\` on #${t}`, () => github.rest.issues.addLabels({owner, repo, issue_number: t, labels: ['needs-human']}));
                if (a) problems.push(a);
              }
              const status = [`\`in-progress\` released on ${released.join(', ')}`, ...problems.map(p => `⚠️ ${p} — do it by hand`)].join('; ');
              await github.rest.issues.createComment({owner, repo, issue_number: number,
                body: `${marker}\n🛑 Review-fix **exhausted** after ${MAX} attempts; ${kinds.join(' + ')} findings remain at ${head.slice(0, 7)}. Escalated \`needs-human\`${issues.length ? ` on ${issues.map(n => `#${n}`).join(', ')}` : ''}; ${status}.`});
              // The PR's own needs-human is the escalation signal humans watch: if it could not be applied, fail loudly.
              if (problems.some(p => p.includes(`\`needs-human\` on #${number}`))) throw new Error(`review-fix: escalation incomplete — ${problems.join('; ')}`);
              return out('no');
            }
            const n = attempts + 1;
            await github.rest.issues.addLabels({owner, repo, issue_number: number, labels: [`review-fix-${n}`]});
            await github.rest.issues.createComment({owner, repo, issue_number: number,
              body: `${marker}\n🔧 ${kinds.join(' + ')} findings at ${head.slice(0, 7)} — review-fix attempt ${n} of ${MAX} starting on \`${pr.head.ref}\` (run ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}).\n\nPolicy (#134): BLOCKING findings — defects in the change, security, weakened tests, spec divergence, unmet acceptance criteria, false claims — are fixed (a fix may SHRINK the diff by dropping out-of-scope work); FOLLOW-UP findings outside the linked issue's acceptance criteria are left for a proposed issue, not fixed here. Disable the \`review-fix\` workflow to stop this loop.`});
            // Snapshot the closing references the merge gate acts on: the fixer may now edit the body
            // (#463), and detect compares this against the body after the run — with the SAME
            // function, loaded from this job's default-branch checkout (no Claude step runs here).
            // The references as the merge automation reads them (raw body, each as spelled); `none` when empty.
            const closesBefore = noop.closingRefs(pr.body || '', owner, repo) || 'none';
            return out('yes', {pr: number, branch: pr.head.ref, head, attempt: n, kinds: kinds.join(','), closes: closesBefore});

  fix:
    needs: gate
    if: needs.gate.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write   # anthropics/claude-code-action exchanges an OIDC token for its App token (found 2026-08-29)
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.branch }}
          fetch-depth: 0
          # The agent's push must NOT carry GITHUB_TOKEN credentials: pushes made with them
          # are suppressed as workflow_run/re-review event sources, which is exactly how the
          # CI router lost its own attempts' failures (docs/OPEN-QUESTIONS.md 2026-08-31).
          # With credentials unpersisted the push uses the Claude App token, so the resulting
          # `synchronize` re-review and CI chaining actually fire.
          persist-credentials: false
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Toolchain (so the agent can run the pipeline)
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          pip install -r tools/requirements.txt   # includes the clang-format pin: a bare ./pipeline.sh reaches stage_quality, which FAILS on CI without it (#135; #167 review)
      # `always()`: a failed apt/pip/checkout step above used to SKIP this, so SINCE arrived
      # empty and detection fell open on stale evidence (round-3 red team). The module also fails
      # closed on an empty SINCE; this makes the normal path record a real start.
      - name: Mark the start of the run
        id: t0
        if: always()
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # ONE prompt for both the first pass and the retry: two inline copies would drift, and a
      # drifted retry prompt silently changes the agent's instructions on the second pass.
      # It comes from the DEFAULT branch and is written to RUNNER_TEMP, never the workspace. This
      # job checks out the PR's BRANCH, which may predate this change and not contain the file at
      # all; and the Claude step runs there with Edit/Write and `git*`, so an untracked directory
      # in that tree could be swept into the agent's own commit.
      # The detector and the budget config come from the DEFAULT branch and land OUTSIDE the
      # workspace. The previous `.agent-ci` checkout was not enough: the AC2 retry step runs after
      # it, holding Edit/Write/Bash(git*) in the PR's own tree, so the monitored agent could
      # rewrite its own no-op check and have github-script execute it with issues:write — and
      # `.agent-ci` is untracked and not in .gitignore, the very hazard the prompt loader below
      # already avoids by writing to RUNNER_TEMP (round-2 red team on #416).
      #
      # CONTROL, NOT GUARANTEE (rule 11): `Write` is not path-restricted, so this does not make the
      # file unwritable. It removes it from the tree the agent works in and commits from.
      - name: Fetch the shared detector and config (default branch, outside the workspace)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          for f in tools/ci/agent-noop.js .github/agent-config.yml; do
            out="$RUNNER_TEMP/$(basename "$f")"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${f}?ref=${DEFAULT_BRANCH}" --jq .content \
              | base64 -d > "$out"
            [ -s "$out" ] || { echo "agent-noop: fetched an empty $f from ${DEFAULT_BRANCH}" >&2; exit 1; }
          done

      - name: Load the agent prompt (from the default branch)
        id: prompt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          PR: ${{ needs.gate.outputs.pr }}
          BRANCH: ${{ needs.gate.outputs.branch }}
          HEAD_SHA: ${{ needs.gate.outputs.head }}
          ATTEMPT: ${{ needs.gate.outputs.attempt }}
          KINDS: ${{ needs.gate.outputs.kinds }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/agent-prompts/review-fix.md?ref=${DEFAULT_BRANCH}" \
            --jq .content | base64 -d > "$RUNNER_TEMP/prompt.raw"
          [ -s "$RUNNER_TEMP/prompt.raw" ] || { echo "prompt fetch returned nothing — refusing to run the agent with no instructions" >&2; exit 1; }
          # Substituted in python, not sed: a branch name may legally contain `|` or `&`, which
          # would break or re-aim an `s|...|...|` expression (round-2 review).
          python3 - <<'PY' > "$RUNNER_TEMP/prompt.md"
          import os, pathlib
          t = pathlib.Path(os.environ['RUNNER_TEMP'] + '/prompt.raw').read_text()
          for k, v in (('{{PR}}', 'PR'), ('{{BRANCH}}', 'BRANCH'), ('{{HEAD}}', 'HEAD_SHA'),
                       ('{{ATTEMPT}}', 'ATTEMPT'), ('{{KINDS}}', 'KINDS')):
              t = t.replace(k, os.environ[v])
          print(t, end='')
          PY
          [ -s "$RUNNER_TEMP/prompt.md" ] || { echo "prompt is empty after substitution" >&2; exit 1; }
          {
            echo "text<<PROMPT_EOF_${GITHUB_RUN_ID}"
            cat "$RUNNER_TEMP/prompt.md"
            echo "PROMPT_EOF_${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"

      # `gh pr edit*` (#463): the round-budget ruling makes a false PR-body claim BLOCKING at every
      # round, and the fixer was the one agent that could not touch the body — #452 sat for 40
      # minutes on a stale count in its description. The grant is the EXACT command the prompt
      # dictates — this PR, this file, nothing after, no wildcard: `gh pr edit` also adds/removes
      # labels (the surface agent-merge and the attempt budget read), and a trailing `*` let
      # `--body-file x --remove-label needs-human` through (rounds 1 and 2 on #466). The body's
      # Closes/Fixes/Resolves set is snapshotted by the gate and compared by detect.
      - name: Claude Code — address the review findings on the agent's branch
        id: agent                       # the execution file (turns, denials, is_error) is a step output; an id-less step has none
        # Pinned to the commit v1 resolved to on 2026-09-02, not the moving `v1` tag:
        # CodeQL's actions/unpinned-tag flagged this file (alert 187 on #113) and the
        # `CodeQL` results check is a required check (GOVERNANCE.md §2, ruled 2026-08-28).
        # Bump deliberately; the other workflows still track `v1` and are the older,
        # already-alerted-or-accepted pattern.
        uses: anthropics/claude-code-action@8251c103ac8c1d761882c86aba1412c7f583c844   # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude,github-actions   # the triggering comment is claude[bot]'s verdict; a github-actions dispatch is the manual path
          prompt: ${{ steps.prompt.outputs.text }}
          # claude-opus-5, like every agent loop (model-tier ruling 2026-09-11, superseding the
          # 2026-08-31 split that left the implementation loops on the action default). Pinned
          # by test_every_agent_loop_runs_on_opus.
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash(./pipeline.sh*),Bash(git*),Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr comment*),Bash(gh pr edit ${{ needs.gate.outputs.pr }} --body-file /tmp/pr-body.md),Edit,Read,Write,Grep,Glob"

      # #361. This step used to be `if: failure()`, so it never fired for the runs that mattered:
      # #342's fix produced nothing TWICE while exiting success, each time having already spent an
      # attempt (the gate applies `review-fix-<n>` before this job runs, :161). Detection now runs
      # whatever the outcome, and a run that did nothing hands its attempt back.
      - name: Did the agent produce anything?
        id: detect
        if: always()
        uses: actions/github-script@v7
        env:
          KIND: fix
          PR: ${{ needs.gate.outputs.pr }}
          HEAD_BEFORE: ${{ needs.gate.outputs.head }}
          CLOSES_BEFORE: ${{ needs.gate.outputs.closes }}
          SINCE: ${{ steps.t0.outputs.at }}
          EXEC_FILE: ${{ steps.agent.outputs.execution_file }}
        with:
          script: |
            const m = require(`${process.env.RUNNER_TEMP}/agent-noop.js`);
            await m.detect({github, context, core, env: process.env});

      - name: How many retries may this run spend?
        id: budget
        if: always()
        uses: actions/github-script@v7
        env:
          CONFIG: ${{ runner.temp }}/agent-config.yml
        with:
          script: |
            const m = require(`${process.env.RUNNER_TEMP}/agent-noop.js`);
            core.setOutput('n', String(m.retryBudget(process.env, core)));

      # AC2's delay. #361 reads the observed no-ops as "probably a transient problem on the
      # Claude side at the time", so retrying immediately re-enters the window that caused them.
      # 60s is deliberately short: it is a settle, not a backoff, and the job's own
      # timeout-minutes still bounds the whole run.
      # Both retry steps are also gated on the FIRST pass having run: a failure before the prompt
      # loader skips it and the first Claude step, and the retry would then launch with an EMPTY
      # prompt and Edit/Write on the branch (round-3 review).
      - name: Settle before retrying
        if: always() && steps.agent.conclusion != 'skipped' && steps.detect.outputs.produced == 'false' && steps.budget.outputs.n != '' && steps.budget.outputs.n != '0'
        run: sleep 60

      # #361 AC2. A run that produced nothing is retried once (agent_retry_max, default 1) before
      # the attempt is returned and the PR escalated. Same pinned action and same prompt as above.
      - name: Claude Code — retry the fix
        id: agent_retry
        if: always() && steps.agent.conclusion != 'skipped' && steps.detect.outputs.produced == 'false' && steps.budget.outputs.n != '' && steps.budget.outputs.n != '0'
        uses: anthropics/claude-code-action@8251c103ac8c1d761882c86aba1412c7f583c844   # v1, pinned as above
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude,github-actions
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash(./pipeline.sh*),Bash(git*),Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr comment*),Bash(gh pr edit ${{ needs.gate.outputs.pr }} --body-file /tmp/pr-body.md),Edit,Read,Write,Grep,Glob"

      - name: Did the retry produce anything?
        id: detect_retry
        if: always() && steps.agent_retry.conclusion != 'skipped'
        uses: actions/github-script@v7
        env:
          KIND: fix
          PR: ${{ needs.gate.outputs.pr }}
          HEAD_BEFORE: ${{ needs.gate.outputs.head }}
          CLOSES_BEFORE: ${{ needs.gate.outputs.closes }}
          SINCE: ${{ steps.t0.outputs.at }}
          EXEC_FILE: ${{ steps.agent_retry.outputs.execution_file }}
        with:
          script: |
            const m = require(`${process.env.RUNNER_TEMP}/agent-noop.js`);
            await m.detect({github, context, core, env: process.env});

      - name: Return the attempt and escalate if it produced nothing
        id: finalize
        if: always()
        uses: actions/github-script@v7
        env:
          KIND: fix
          PR: ${{ needs.gate.outputs.pr }}
          ATTEMPT: ${{ needs.gate.outputs.attempt }}
          NOOP: ${{ steps.detect_retry.outputs.noop != '' && steps.detect_retry.outputs.noop || steps.detect.outputs.noop }}
          REASON: ${{ steps.detect_retry.outputs.reason != '' && steps.detect_retry.outputs.reason || steps.detect.outputs.reason }}
          PRODUCED: ${{ steps.detect_retry.outputs.produced != '' && steps.detect_retry.outputs.produced || steps.detect.outputs.produced }}
          ONLY_COMMENT: ${{ steps.detect_retry.outputs.only_comment != '' && steps.detect_retry.outputs.only_comment || steps.detect.outputs.only_comment }}
          REFS_CHANGED: ${{ steps.detect_retry.outputs.refs_changed != '' && steps.detect_retry.outputs.refs_changed || steps.detect.outputs.refs_changed }}
          REFS_DETAIL: ${{ steps.detect_retry.outputs.refs_detail != '' && steps.detect_retry.outputs.refs_detail || steps.detect.outputs.refs_detail }}
          ATTEMPTS: ${{ steps.agent_retry.conclusion != 'skipped' && '2' || '1' }}
          FIGURES_1: turns=${{ steps.detect.outputs.turns }}, denials=${{ steps.detect.outputs.denials }}
          FIGURES_2: ${{ steps.agent_retry.conclusion != 'skipped' && format('turns={0}, denials={1}', steps.detect_retry.outputs.turns, steps.detect_retry.outputs.denials) || '' }}
          TURNS: ${{ steps.detect_retry.outputs.turns != '' && steps.detect_retry.outputs.turns || steps.detect.outputs.turns }}
          DENIALS: ${{ steps.detect_retry.outputs.denials != '' && steps.detect_retry.outputs.denials || steps.detect.outputs.denials }}
        with:
          script: |
            const m = require(`${process.env.RUNNER_TEMP}/agent-noop.js`);
            // An EMPTY noop means `detect` itself failed (missing module, API 403/500, failed
            // checkout). The `if: failure()` step this replaced released on any job failure, so
            // returning here would hold the spent attempt silently — a regression (round-1).
            // A comment-only run is production (the attempt stands) but the loop cannot advance from
            // it — finalize applies needs-human so a human reads the answer (#463, seen on #452).
            if (process.env.NOOP === 'false' && process.env.ONLY_COMMENT !== 'true' && process.env.REFS_CHANGED !== 'true') return;   // it pushed — the attempt stands
            await m.finalize({github, context, core, env: process.env});

