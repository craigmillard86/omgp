name: risk-score
# Automatic PR risk tiering by touched paths + change shape (GOVERNANCE.md §3).
# Applies risk:t0..t3 label; T3 additionally gets needs-human and a comment.
on:
  # pull_request_target so fork PRs can be labelled (write token).
  # SAFE ONLY because this job never checks out or runs PR code — it
  # reads the changed-file list via the API. Never add a checkout here.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles,
              {owner, repo, pull_number: pr.number, per_page: 100});
            const paths = files.map(f => f.filename);
            const touches = re => paths.some(p => re.test(p));
            // "Test content" is not only C++ under tests/: tools/refimpl/test_*.py is the 441-test
            // Python suite that drives every workflow harness in this repo (agent-merge,
            // agent-approve, the story gate, the follow-up filer) and holds the unit-test floor
            // ratchet. Anchored at ^tests/ alone, deleting any of it scored T1 — inside
            // auto_merge_max_tier, i.e. an agent could delete its own gate's tests and merge that
            // autonomously (round-1 red team on #420, finding 1). Pinned by risk_score_harness.js.
            // Note the rule still cannot punish ADDING tests: it requires deletions > 0.
            const removedTests = files.some(f =>
              /^(tests\/|tools\/refimpl\/test_)/.test(f.filename) && f.deletions > 0 &&
              (f.status === 'removed' || f.deletions > f.additions));

            // Added lines only (patch text starting with '+', excluding the
            // '+++' file header). Workflow `uses:` additions are already T3
            // via the governance-artefact rule below; this exists mainly to
            // catch new CMake FetchContent/find_package calls and new pip
            // pins, which aren't otherwise flagged.
            const addedLines = f => (f.patch || '').split('\n')
              .filter(l => l.startsWith('+') && !l.startsWith('+++'));
            const newDependency = files.some(f => {
              const added = addedLines(f);
              if (/(^|\/)CMakeLists\.txt$|\.cmake$/.test(f.filename))
                return added.some(l => /FetchContent|find_package/.test(l));
              if (f.filename === 'tools/requirements.txt')
                return added.length > 0;
              if (/^\.github\/workflows\//.test(f.filename))
                return added.some(l => /uses:\s*\S/.test(l));
              return false;
            });

            let tier = 0, reasons = [];
            const T = (n, why) => { if (n > tier) tier = n; reasons.push(`T${n}: ${why}`); };

            if (touches(/^(protocol\/|tests\/vectors\/|\.github\/|CLAUDE\.md|docs\/(OPERATING-POLICY|GOVERNANCE|DEFINITION-OF-READY|protocol-l3|trunk-link-layer|omgp-spec)|\.specify\/memory\/|tools\/mutate\.cfg)/))
              T(3, 'touches ground-truth or governance artefacts');
            if (removedTests) T(3, 'reduces test content');
            if (touches(/^(core\/|link\/|l3\/)/)) T(2, 'portable protocol-critical code');
            // tests/unit-test-floor.txt holds the unit-test execution floor, which lived in
            // pipeline.sh (T2 + CODEOWNERS) until 2026-09-12. A one-line change to it is +1/-1, so
            // `removedTests` cannot see it and it scored T0 — "docs/tests only" — for a gate
            // threshold (round-1 red team on #420, finding 1). A raise stays T2 and can still merge
            // autonomously; a LOWERING is caught by tools/refimpl/test_floor_datum.py's ratchet.
            if (touches(/^(pipeline\.sh|IDF_VERSION|tests\/unit-test-floor\.txt|tools\/(codegen\.py|mutate\.sh|mutate_report\.py|fuzz-smoke\.sh))/)) T(2, 'build/toolchain definition');
            if (newDependency) T(2, 'introduces a new dependency');
            if (pr.additions + pr.deletions > 800) T(2, `large change (${pr.additions + pr.deletions} lines)`);
            if (touches(/^(sim\/|cli\/|transport\/|tools\/)/)) T(1, 'host-only code');
            if (tier === 0) reasons.push('T0: docs/tests/scenarios only');

            // replace any prior risk label
            for (const l of pr.labels.filter(l => l.name.startsWith('risk:')))
              await github.rest.issues.removeLabel({owner, repo, issue_number: pr.number, name: l.name}).catch(()=>{});
            const labels = [`risk:t${tier}`];
            if (tier === 3) labels.push('needs-human');
            await github.rest.issues.addLabels({owner, repo, issue_number: pr.number, labels});
            if (tier === 3)
              await github.rest.issues.createComment({owner, repo, issue_number: pr.number,
                body: `⚖️ **Risk T3** — this PR touches artefacts requiring explicit human ruling (GOVERNANCE.md §3):\n\n- ${reasons.join('\n- ')}\n\nCODEOWNERS review is required; agent-authored T3 changes should normally have been escalated, not implemented.`});
            core.summary.addHeading(`Risk tier: T${tier}`).addList(reasons).write();
