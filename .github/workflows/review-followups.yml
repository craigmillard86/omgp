name: review-followups
# Files the reviewer's proposed FOLLOW-UPS (scope ruling #134) as `task` issues, so an
# out-of-scope suggestion is TRACKED instead of evaporating (#136 red team, MEDIUM). Without
# this the `## FOLLOW-UPS` section the reviewer emits had no consumer and neither agent could
# open the issue.
#
# Deterministic github-script, no agent and no PR code: like agent-approve, the `issue_comment`
# trigger runs the DEFAULT-branch definition, so a PR cannot rewrite this in its own diff.
# Dedup by open-`task` title so re-review on each push does not re-file. Files `task` ONLY —
# never `ready`/`queued`: release and enrichment stay a human/auto-release decision (GOVERNANCE
# §1). A hard cap bounds a runaway comment.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: review-followups-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  file:
    if: >
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'claude[bot]' &&
      contains(github.event.comment.body, 'VERDICT(') &&
      contains(github.event.comment.body, '## FOLLOW-UPS')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const CAP = 10;   // bound a runaway comment
            const c = context.payload.comment;
            if (!c || !c.user || c.user.login !== 'claude[bot]') { core.notice('followups: not a claude[bot] comment — untouched'); return; }
            const body = String(c.body || '');
            if (!body.includes('VERDICT(')) { core.notice('followups: not a verdict comment — untouched'); return; }
            const issue = context.payload.issue;
            if (!issue || !issue.pull_request) { core.notice('followups: comment is not on a PR — untouched'); return; }
            const pr = issue.number;

            // Extract the "## FOLLOW-UPS" section: bullets until the next heading, a horizontal
            // rule, the NOT EXAMINED disclosure, or the verdict line. Nothing after those is a
            // follow-up.
            //
            // The marker is written emphasised as often as bare (`**NOT EXAMINED:**`, and under
            // its own `###`), and a `---` rule usually separates it from the follow-ups. Testing
            // only `^NOT EXAMINED:` and `^##\s` let the whole disclosure through: eight verdicts
            // on #145/#149 filed ~57 scope-disclosure bullets as `task` issues on 2026-09-07
            // (#264-#270, #279-#290, #296-#306, #308-#313, #315-#318, #322-#335). Strip markdown
            // emphasis and heading marks before testing the line.
            const unmark = (s) => s.replace(/^#{1,6}\s+/, '').replace(/^[*_]{1,3}\s*/, '').replace(/\s*[*_]{1,3}$/, '').trim();
            const lines = body.split('\n');
            const start = lines.findIndex(l => /^##\s*FOLLOW-UPS\b/i.test(l.trim()));
            if (start < 0) { core.notice('followups: no FOLLOW-UPS section — nothing to file'); return; }
            const items = [];
            for (let i = start + 1; i < lines.length; i++) {
              const t = lines[i].trim();
              if (/^#{1,6}\s/.test(t) || /^(-{3,}|\*{3,}|_{3,})$/.test(t) ||
                  /^NOT EXAMINED\b/i.test(unmark(t)) || /^VERDICT\(/.test(t)) break;
              const m = t.match(/^[-*]\s+(.*\S)\s*$/);
              if (m && !/^none\b/i.test(unmark(m[1]))) items.push(m[1].trim());
            }
            if (!items.length) { core.notice('followups: none proposed — nothing to file'); return; }

            // Dedup against open `task` issues. Exact titles are not enough: a standing proposal
            // is rephrased between rounds ("answer via" -> "answer through", backticks added or
            // dropped), which filed ONE proposal seven times on #149 (#253, #258, #262, #275,
            // #278, #291, #292). Compare normalised token sets instead, and treat a near-identical
            // set as the same proposal. The threshold is deliberately high: over-merging drops a
            // genuine follow-up silently, which is worse than a duplicate the maintainer can close.
            const STOP = new Set(['a','an','the','of','to','for','in','on','at','by','and','or','its','it','is','be','as','with','via','through','from','not','no','into','against','that','this','their','than','then','s']);
            const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
            const toks = (s) => new Set(norm(s).split(' ').filter(x => x && !STOP.has(x)));
            const same = (a, b) => {
              if (norm(a) === norm(b)) return true;
              const A = toks(a), B = toks(b);
              if (!A.size || !B.size) return false;
              let inter = 0; for (const x of A) if (B.has(x)) inter++;
              return inter / (A.size + B.size - inter) >= 0.8;   // Jaccard over content tokens
            };
            const open = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', labels: 'task', per_page: 100});
            const seen = open.filter(i => !i.pull_request).map(i => i.title);

            let filed = 0;
            for (const item of items.slice(0, CAP)) {
              let title = item.replace(/^\[(HIGH|MEDIUM|LOW)\]\s*/i, '');   // drop a leading severity tag
              title = (title.split(' — ')[0] || title).slice(0, 120).trim(); // the "TITLE — why" head
              title = unmark(title);                                         // drop wrapping ** or *
              if (!title) continue;
              const dup = seen.find(t => same(t, title));
              if (dup) { core.notice(`followups: '${title}' duplicates open task '${dup}' — skipped`); continue; }
              const r = await github.rest.issues.create({owner, repo, title, labels: ['task'],
                body: `Proposed by the review of #${pr} (scope ruling #134, docs/OPEN-QUESTIONS.md): ${item}\n\n` +
                      'Labelled `task` only — release (`ready`/`queued`) and enrichment stay a maintainer/auto-release decision (GOVERNANCE.md §1). Close if not worth doing.'});
              seen.push(title); filed++;
              core.notice(`followups: filed ${r.data.html_url}`);
            }
            core.notice(`followups: filed ${filed} of ${items.length} proposed for #${pr}` + (items.length > CAP ? ` (capped at ${CAP})` : ''));
