name: review-followups
# Files the reviewer's proposed FOLLOW-UPS (scope ruling #134) as `task` issues, so an
# out-of-scope suggestion is TRACKED instead of evaporating (#136 red team, MEDIUM). Without
# this the `## FOLLOW-UPS` section the reviewer emits had no consumer and neither agent could
# open the issue.
#
# Deterministic github-script, no agent and no PR code: like agent-approve, the `issue_comment`
# trigger runs the DEFAULT-branch definition, so a PR cannot rewrite this in its own diff.
# Dedup by open-`task` title so re-review on each push does not re-file. Files `task` ONLY —
# never `ready`/`queued`: release and enrichment stay a human/auto-release decision (GOVERNANCE
# §1). A hard cap bounds a runaway comment.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: review-followups-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  file:
    if: >
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'claude[bot]' &&
      contains(github.event.comment.body, 'VERDICT(') &&
      contains(github.event.comment.body, '## FOLLOW-UPS')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const CAP = 10;   // bound a runaway comment
            const c = context.payload.comment;
            if (!c || !c.user || c.user.login !== 'claude[bot]') { core.notice('followups: not a claude[bot] comment — untouched'); return; }
            const body = String(c.body || '');
            if (!body.includes('VERDICT(')) { core.notice('followups: not a verdict comment — untouched'); return; }
            const issue = context.payload.issue;
            if (!issue || !issue.pull_request) { core.notice('followups: comment is not on a PR — untouched'); return; }
            const pr = issue.number;

            // Extract the "## FOLLOW-UPS" section: bullets until the next heading, the NOT EXAMINED
            // disclosure, or the verdict line. Nothing after those is a follow-up.
            //
            // The marker is written emphasised as often as bare (`**NOT EXAMINED:**`, and under its
            // own `###`). Testing only `^NOT EXAMINED:` and `^##\s` let the whole disclosure through:
            // eight verdicts on #145/#149 filed ~57 scope-disclosure bullets as `task` issues on
            // 2026-09-07 (#264-#270, #279-#290, #296-#306, #308-#313, #315-#318, #322-#335). Strip
            // markdown emphasis and heading marks before testing the line.
            //
            // Two things are deliberately NOT stop conditions, both learned from #341's red team:
            //   - a `---` rule. Verdicts use one as an in-prose separator BETWEEN findings (22 of the 92
            //     comments in the 2026-09-08 corpus), so stopping there drops later proposals. The corpus shape
            //     "rule, then marker" is handled by the marker test, which is the load-bearing one.
            //   - `###`..`######`. Widening the heading test to `^#{1,6}\s` makes a shell comment in
            //     a fenced reproducer end the section (20 such lines across 8 of those comments), and
            //     the brief REQUIRES a runnable reproducer per finding. `### NOT EXAMINED` still
            //     stops, via unmark + the marker test.
            // Fenced blocks are skipped so a `## ` inside one cannot end the section either — but only
            // up to a real closer (same character, at least as long, nothing else on the line). An
            // opener with NO closer is read as plain text, with a warning. Skipping to end-of-body
            // instead dropped every later proposal AND both stop markers while logging `filed 1 of 1`
            // (#341 red team round 2), and it is reachable without malice: GitHub truncates a comment
            // at 65 536 characters, and every finding carries a fenced reproducer.
            const unmark = (s) => s.replace(/^#{1,6}\s+/, '').replace(/^[*_]{1,3}\s*/, '').replace(/\s*[*_]{1,3}$/, '').trim();
            const lines = body.split('\n');
            const start = lines.findIndex(l => /^##\s*FOLLOW-UPS\b/i.test(l.trim()));
            if (start < 0) { core.notice('followups: no FOLLOW-UPS section — nothing to file'); return; }
            const items = [];
            const opener = (t) => { const f = t.match(/^(`{3,}|~{3,})/); return f ? f[1] : null; };
            const closes = (t, f) => { const g = t.match(/^(`{3,}|~{3,})\s*$/); return !!g && g[1][0] === f[0] && g[1].length >= f.length; };
            const isStop = (t) => /^NOT EXAMINED\b/i.test(unmark(t)) || /^VERDICT\(/.test(t);
            // An opener counts as UNCLOSED (read as plain text, with a warning) when, before any
            // closer, the scan meets either another opener of the same kind carrying an info string
            // (a line that cannot close the block, so the author evidently thought the earlier fence
            // was closed) or a stop line. Pairing it with the next bare fence instead swallowed the
            // proposals in between and, one block later, the NOT EXAMINED marker itself, filing the
            // disclosure (#341 red team round 3). The cost, by design and warned about: a genuine
            // block that quotes a stop line at the start of a line is re-read as prose, and that
            // quoted line then ends the scan. A stop too early was chosen over a disclosure filed.
            for (let i = start + 1; i < lines.length; i++) {
              const t = lines[i].trim();
              const f = opener(t);
              if (f) {
                let j = i + 1, why = '';
                for (; j < lines.length; j++) {
                  const u = lines[j].trim();
                  if (closes(u, f)) break;
                  const g = opener(u);
                  if (g && g[0] === f[0] && g.length >= f.length) { why = 'another fence opened first'; break; }
                  if (isStop(u)) { why = 'a stop line came first'; break; }
                }
                if (j < lines.length && !why) { i = j; continue; }    // balanced: skip the block
                core.warning(`followups: unclosed fence at comment line ${i + 1} (${why || 'no closer'}) — read as plain text, not skipped`);
                continue;                                             // unclosed: the opener line only
              }
              if (/^##\s/.test(t) || isStop(t)) break;
              const m = t.match(/^[-*]\s+(.*\S)\s*$/);
              // "none" is how a verdict says it proposes nothing. Test the TITLE head exactly, so
              // "- **None** — nothing outside the change" is still recognised while a proposal
              // whose first word happens to be "None" survives as the real follow-up it is.
              if (m && !/^none[.!]?$/i.test(unmark(m[1].split(' — ')[0]))) items.push(m[1].trim());
            }
            if (!items.length) { core.notice('followups: none proposed — nothing to file'); return; }

            // Dedup against open `task` issues. Exact titles are not enough: a standing proposal
            // is rephrased between rounds ("answer via" -> "answer through", backticks added or
            // dropped), which filed ONE proposal seven times on #149 (#253, #258, #262, #275,
            // #278, #291, #292). Compare normalised token sets instead, and treat a near-identical
            // set as the same proposal. The threshold is deliberately high: over-merging drops a
            // genuine follow-up silently, which is worse than a duplicate the maintainer can close.
            // Articles, and prepositions whose removal does not flip a title's sense. `via` and
            // `through` are here on purpose: they are treated as synonyms (the #253 family was one
            // proposal rephrased "via" -> "through"). Words that DO carry sense are content words:
            // `not`, `no` and `against` (#341 round 1), and the directional `to`, `from` and `into`
            // and the conjunctions `and` and `or` (round 3). With those stopped, "copy X into Y" and
            // "copy X from Y" were one token set in one order, and the second was never filed.
            const STOP = new Set(['a','an','the','of','for','in','on','at','by','its','it','is','be','as','with','via','through','that','this','their','than','then','s']);
            const norm = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
            const seq = (s) => norm(s).split(' ').filter(x => x && !STOP.has(x));
            const toks = (s) => new Set(seq(s));
            // Word order carries sense as well: a token SET made "count a frame-level discard
            // against the bus-level counter" and its reversal identical (J = 1.0), so the second,
            // opposite proposal was silently never filed (#341 red team round 2). The content words
            // two titles share must appear in the same order in both. A synonym swap or an appended
            // word keeps that order; a reversal or converse does not. A repeated word that makes the
            // shared sequences differ in length also fails — the conservative direction (file).
            const sameOrder = (a, b) => {
              const A = seq(a), B = seq(b), inA = new Set(A), inB = new Set(B);
              const ka = A.filter(x => inB.has(x)), kb = B.filter(x => inA.has(x));
              return ka.length === kb.length && ka.every((x, i) => x === kb[i]);
            };
            const same = (a, b) => {
              if (norm(a) === norm(b)) return true;
              const A = toks(a), B = toks(b);
              if (!A.size || !B.size) return false;
              let inter = 0; for (const x of A) if (B.has(x)) inter++;
              // Jaccard over content tokens, >= 0.9. That admits a synonym swap (identical token
              // sets) and a one-token superset only when the shorter title has at least 9 content
              // tokens (n/(n+1) >= 0.9); shorter titles must match their token sets exactly. It
              // rejects one differing content word out of nine (0.8) and "with no window" vs "with
              // a window" (0.857), both of which 0.8 merged.
              return inter / (A.size + B.size - inter) >= 0.9 && sameOrder(a, b);
            };
            const open = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', labels: 'task', per_page: 100});
            const seen = open.filter(i => !i.pull_request).map(i => i.title);

            let filed = 0;
            for (const item of items.slice(0, CAP)) {
              let title = item.replace(/^\[(HIGH|MEDIUM|LOW)\]\s*/i, '');   // drop a leading severity tag
              title = (title.split(' — ')[0] || title).slice(0, 120).trim(); // the "TITLE — why" head
              title = unmark(title);                                         // drop wrapping ** or *
              if (!title) continue;
              const dup = seen.find(t => same(t, title));
              if (dup) { core.notice(`followups: '${title}' duplicates open task '${dup}' — skipped`); continue; }
              const r = await github.rest.issues.create({owner, repo, title, labels: ['task'],
                body: `Proposed by the review of #${pr} (scope ruling #134, docs/OPEN-QUESTIONS.md): ${item}\n\n` +
                      'Labelled `task` only — release (`ready`/`queued`) and enrichment stay a maintainer/auto-release decision (GOVERNANCE.md §1). Close if not worth doing.'});
              seen.push(title); filed++;
              core.notice(`followups: filed ${r.data.html_url}`);
            }
            core.notice(`followups: filed ${filed} of ${items.length} proposed for #${pr}` + (items.length > CAP ? ` (capped at ${CAP})` : ''));
