name: ready-gate
# Definition-of-Ready enforcement (docs/DEFINITION-OF-READY.md). Two release paths, both
# human judgement, both validated here:
#   `ready`  — dispatch now: content validation + every dependency must be closed.
#   `queued` — batch release: the SAME content validation, but open dependencies are
#              allowed; promote-queued.yml swaps queued -> ready when they all close.
# Non-conforming stories have the label removed with a gap list — a release label only
# sticks on a story that is genuinely agent-implementable.
# repository_dispatch(ready-gate): final validation requested by promote-queued.yml after it
# applied `ready` — a label added with GITHUB_TOKEN never starts a `labeled` run on its own.
on:
  issues:
    types: [labeled]
  repository_dispatch:
    types: [ready-gate]

permissions:
  issues: write

jobs:
  validate:
    if: >
      github.event_name == 'repository_dispatch' ||
      github.event.label.name == 'ready' || github.event.label.name == 'queued'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const dispatched = context.eventName === 'repository_dispatch';
            const iss = dispatched
              ? (await github.rest.issues.get({owner, repo, issue_number: Number(context.payload.client_payload.issue)})).data
              : context.payload.issue;
            const mode = dispatched ? 'ready' : context.payload.label.name;   // 'ready' | 'queued'
            const has = name => iss.labels.some(l => l.name === name);
            if (dispatched && !has('ready')) { core.notice(`#${iss.number}: no longer labelled ready — nothing to validate`); return; }
            const body = iss.body || '';
            const problems = [];
            // --- content validation: identical for both paths ---------------------------
            const required = ['Intent', 'Spec references', 'Acceptance criteria',
                              'Evidence required', 'Out of scope', 'Dependencies',
                              'Expected risk tier'];
            // Headings as `### Name` (h2–h4, ATX: at least one space) or a bold title line
            // `**Name**` — enrichment on #26 used the bold form and every section read as
            // missing (2026-08-30). The boundary matches only one of the seven KNOWN headings,
            // so a bold aside inside a section (a `**Note**` line) cannot end the section early
            // and silently drop what follows (review of #90). Tested in tests/workflows/.
            const HEADING = `(?:#{2,4}\\s+(?:${required.join('|')})|\\*\\*(?:${required.join('|')})\\*\\*)`;
            const section = name => {
              const m = body.match(new RegExp(`(?:^|\\n)(?:#{2,4}\\s+|\\*\\*)${name}(?:\\*\\*)?\\s*\\n([\\s\\S]*?)(?=\\n${HEADING}\\s*\\n|$)`, 'i'));
              return m ? m[1].trim() : null;
            };
            for (const s of required) {
              const v = section(s);
              if (v === null) problems.push(`missing section: **${s}**`);
              // "empty" = no word character or issue ref at all (a Dependencies section of
              // just "#1" is two characters and perfectly valid; a length threshold rejected it).
              else if (v.replace(/[^\w#]/g, '').length === 0 || /^_?no response_?$/i.test(v))
                problems.push(`empty section: **${s}**`);
            }
            const acc = section('Acceptance criteria') || '';
            if (!/- \[[ x]\]/i.test(acc))
              problems.push('Acceptance criteria must be checkbox assertions (`- [ ] ...`)');
            const risk = section('Expected risk tier') || '';
            // The DECLARED tier is the first T0–T3 token in the section (enrichment writes it
            // first: "**T2** — …"). A bare /T3/ test matched rationale text such as "no T3 task
            // exists in this feature" and refused T1 stories (#22, 2026-08-29).
            const declared = (risk.match(/\bT([0-3])\b/) || [])[1];
            if (declared === undefined)
              problems.push('Expected risk tier must state a tier as T0/T1/T2/T3 (first token of the section)');
            else if (declared === '3')
              problems.push('Expected risk **T3**: human-ruling work must not be released to agent dispatch — split the story or do the T3 part first, humanly');
            if (/REPLACE:/.test(body))
              problems.push('template placeholders (`REPLACE:`) still present');
            // --- dependencies: blocking for `ready`, informational for `queued` -----------
            // Blocking dependencies (docs/DEFINITION-OF-READY.md "Dependencies rule"): refs on list
            // items (`- #N …`, continuation lines joined) that are not marked non-blocking; a section
            // with no list items counts every ref (prose style); `#A–#B` ranges expand. Enrichment
            // wrote "not blocking … #27" / "sibling … expected to remain open" mentions that the
            // old every-ref parser turned into dependency cycles (#26↔#27, 2026-08-30).
            const NONBLOCK = /\bnot\s+(?:a\s+)?(?:blocking|blocked|dependent)\b|\bnon-blocking\b|\bno ordering dependency\b|\bexpected to remain (?:open|so)\b|\bsame PR\b|\bsiblings?\b/i;
            const depRefs = text => {
              const items = []; let cur = null;
              for (const line of (text || '').split('\n')) {
                if (/^\s*[-*]\s/.test(line)) { cur = [line]; items.push(cur); }
                else if (cur && line.trim() && /^\s+\S/.test(line)) cur.push(line);
                else cur = null;
              }
              const sources = items.length ? items.map(i => i.join(' ')).filter(i => !NONBLOCK.test(i)) : [text || ''];
              const refs = new Set();
              for (const s of sources) {
                for (const m of s.matchAll(/#(\d+)\s*[–-]\s*#(\d+)/g)) {
                  const a = Number(m[1]), b = Number(m[2]);
                  if (b > a && b - a <= 200) for (let n = a; n <= b; n++) refs.add(n);
                }
                for (const m of s.matchAll(/#(\d+)/g)) refs.add(Number(m[1]));
              }
              return [...refs].sort((x, y) => x - y);
            };
            const open = [];
            for (const n of depRefs(section('Dependencies')).filter(n => n !== iss.number)) {   // never itself (a range can include it)
              const dep = await github.rest.issues.get({owner, repo, issue_number: n}).catch(() => null);
              if (dep && dep.data.state === 'open') open.push(`#${n}`);
            }
            if (mode === 'ready')                       // defence in depth: unchanged for direct `ready`
              for (const d of open) problems.push(`dependency ${d} is still open`);
            // --- outcome -----------------------------------------------------------------
            if (problems.length) {
              await github.rest.issues.removeLabel({owner, repo, issue_number: iss.number, name: mode}).catch(()=>{});
              await github.rest.issues.createComment({owner, repo, issue_number: iss.number,
                body: `🚦 **Not ${mode}** — Definition of Ready gaps (docs/DEFINITION-OF-READY.md):\n\n- ${problems.join('\n- ')}\n\nFix and re-apply \`${mode}\`.`});
              return;
            }
            if (mode === 'ready') {
              await github.rest.issues.createComment({owner, repo, issue_number: iss.number,
                body: `🚦 Definition of Ready: **passed** (predicted T${declared}) — eligible for agent dispatch.`});
              return;
            }
            // queued: content passed; dependencies decide whether it waits or goes now.
            if (open.length) {
              await github.rest.issues.createComment({owner, repo, issue_number: iss.number,
                body: `🚦 **queued** (predicted T${declared}): content passed; will auto-promote to \`ready\` when dependencies close — waiting on ${open.join(', ')}.`});
            } else {
              // Everything is already closed: this run IS the final validation (content + deps),
              // so swap the labels here rather than round-tripping through another run.
              await github.rest.issues.removeLabel({owner, repo, issue_number: iss.number, name: 'queued'}).catch(()=>{});
              await github.rest.issues.addLabels({owner, repo, issue_number: iss.number, labels: ['ready']});
              await github.rest.issues.createComment({owner, repo, issue_number: iss.number,
                body: `🚦 **queued → ready**: dependencies already complete; Definition of Ready **passed** (predicted T${declared}) — eligible for agent dispatch.`});
            }
