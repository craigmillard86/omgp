name: claude-review
# Risk-scaled automated code review: T2/T3 PRs get a Claude review pass
# before human review. Advisory — findings are comments, never blocks;
# the human merge decision remains the gate (GOVERNANCE.md §1).
#
# The tier is resolved at RUN time (.github/actions/risk-tier): a `labeled`
# trigger never fired for risk-score's labels because GitHub starts no run for
# events caused by GITHUB_TOKEN (found 2026-08-29 — this workflow had never
# run). Reviews run per push (`synchronize`) since the 2026-08-31 approval
# ruling: the machine-readable verdict must exist for the CURRENT head, and
# every tier gets a review pass because T0/T1 agent PRs are approvable only
# on a clean verdict — never on green checks alone (PRs #94/#99/#100 were
# green with HIGH review findings).
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to review'
        required: true

permissions:
  id-token: write   # anthropics/claude-code-action exchanges an OIDC token for its App token; without this every run fails "Could not fetch an OIDC token" (found 2026-08-29)
  contents: read
  checks: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ORDER IS LOAD-BEARING (red team on #127). Everything that runs before `head` is
      # resolved and checked runs from the DEFAULT branch — in particular `risk-tier`, a
      # LOCAL composite action whose shell body is read from the checkout and executed with
      # GH_TOKEN while this workflow holds `pull-requests: write`. Checking out PR code first
      # would hand that to the PR.
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}          # default branch: trusted

      # Same-repo guard for BOTH arms. The job-level `if` covers `pull_request` only; on
      # `workflow_dispatch` there is no `github.event.pull_request`, so before this step the
      # ref fell through to `refs/pull/<n>/head` — which for a FORK PR is the fork's code,
      # executed here with the job's token. That was harmless while the checkout was the
      # default branch and nothing ran; adding execution is what made it exploitable, so the
      # guard lands in the same diff. Fails closed: an unresolvable PR reviews nothing.
      - name: Resolve the head, and refuse anything that is not same-repo
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          repo=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.repo.full_name)
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          if [ "$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::#$PR is from fork $repo — this job executes the checked-out code, \
          so a fork head is never reviewed here (GOVERNANCE.md §4b)."
            exit 1
          fi
          [ -n "$sha" ] || { echo "::error::could not resolve the head of #$PR"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - id: tier
        uses: ./.github/actions/risk-tier     # still the trusted copy: PR code is not checked out yet
        with: {pr: '${{ github.event.pull_request.number || inputs.pr }}'}

      # Only now the code under review, at the sha the guard blessed.
      - uses: actions/checkout@v7
        with: {ref: '${{ steps.head.outputs.sha }}', fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - name: Toolchain (so the review can RUN the tests it judges)
        # Added 2026-09-04: without this the reviewer could only read. 26% of verdict-bearing
        # reviews in the fortnight to 2026-09-04 reported running nothing, and a real
        # cross-platform defect survived 17 reading-only rounds on #121 before one pytest run
        # found it. red-team has had this since it was written; the reviewer had not.
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build
          pip install jinja2 pyyaml pytest
      - name: Claude Code — focused review
        # Every tier is reviewed (not only T2/T3) since the 2026-08-31 approval ruling:
        # T0/T1 approvals hang off this verdict, so the verdict must always exist.
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude,github-actions   # claude: agent PRs are opened by the Claude App (found on #76). github-actions: a ci-failure-router auto-fix push arrives as a synchronize event with that actor (live: run 33435939888 on #108, 2026-08-31)
          prompt: |
            Review PR #${{ github.event.pull_request.number || inputs.pr }} (risk
            ${{ steps.tier.outputs.label }}). Read CLAUDE.md and
            docs/GOVERNANCE.md §3 first. Focus, in order:
            1. Conformance to the cited spec sections (docs/protocol-l3.md,
               docs/trunk-link-layer.md) — flag any divergence precisely.
            2. Golden-rule violations: allocation after init in core/link,
               wall-clock use, inline timing constants, non-idempotent ops.
            3. Test integrity: do the new/changed tests assert the
               acceptance criteria of the linked issue (`gh issue view <n>`
               — read it, do not infer it from the PR body)? Any weakened or
               suspiciously narrow assertions?
               RUN THEM. Execute the pipeline stages this diff touches
               (`./pipeline.sh <stages>`, `python3 -m pytest <paths>`,
               `ctest --preset native`) before judging test integrity. A
               finding you demonstrated by running something outranks any
               number of findings from reading: report the executed result
               and label it per rule 11. If a command fails for an
               environmental reason, say so in NOT EXAMINED rather than
               silently reverting to a reading-only pass.
            4. Security: unchecked lengths/bounds in parsers, integer
               overflow in buffer math, injection risks in workflow/tool
               changes.
            Post ONE review comment: findings with file:line references,
            severity-ordered, or an explicit "no findings" — never pad.
            Prefix EVERY finding with its severity as one of `[HIGH]`,
            `[MEDIUM]` or `[LOW]`, exactly those tokens — the review-fix
            loop routes on them: HIGH/MEDIUM are fixed, LOW is fixed only
            where the agent is already changing that code. LOW is for
            style, naming and preference; anything that could produce wrong
            behaviour, a spec divergence, a security hole or a weakened
            test is MEDIUM or above.
            End the comment with a required final section "NOT EXAMINED:"
            listing what was out of scope of this pass (files skipped,
            areas not checked, tools not run). If nothing was excluded,
            state that explicitly: "NOT EXAMINED: nothing excluded".
            After NOT EXAMINED, end with ONE final line, alone and exactly
            in this machine-readable form (the auto-approval gate parses it):
            `VERDICT(review): clean @ <head sha>` if and only if you found
            NO findings of any severity (NOT EXAMINED entries do not count
            as findings); otherwise `VERDICT(review): findings @ <head sha>`.
            <head sha> is the full 40-char head commit of the PR:
            ${{ github.event.pull_request.head.sha }} (if that is blank,
            use `gh pr view <n> --json headRefOid`).
            Do not approve, request changes, or modify code.
          # `Bash(python3 -m pytest*)`, NOT `Bash(python3*)`: the bare form matches
          # `python3 -c '<anything>'`, which reaches `gh` and dissolves the allowlist that
          # deliberately withholds `gh pr review` (red team on #127 — demonstrated, not
          # theorised). The narrow form runs the tests and nothing else.
          #
          # ACCEPTED, and bounded rather than eliminated: running the diff's tests executes
          # the diff's code — a conftest.py in a pytest root runs before any test. That is
          # inherent to a reviewer that verifies rather than reads, and it is why the
          # same-repo guard above is not optional: the executed code is always a
          # collaborator's or an agent's, never an outside contributor's. red-team has
          # carried the same exposure since it was written; the difference is that it runs
          # only at T2/T3 while this runs at every tier, so the guard does the bounding.
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash(./pipeline.sh*),Bash(python3 -m pytest*),Bash(ctest*),Bash(cmake*),Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr comment*),Bash(gh issue view*),Read,Grep,Glob"

