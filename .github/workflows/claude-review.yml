name: claude-review
# Risk-scaled automated code review: T2/T3 PRs get a Claude review pass
# before human review. Advisory — findings are comments, never blocks;
# the human merge decision remains the gate (GOVERNANCE.md §1).
#
# The tier is resolved at RUN time (.github/actions/risk-tier): a `labeled`
# trigger never fired for risk-score's labels because GitHub starts no run for
# events caused by GITHUB_TOKEN (found 2026-08-29 — this workflow had never
# run). Reviews run per push (`synchronize`) since the 2026-08-31 approval
# ruling: the machine-readable verdict must exist for the CURRENT head, and
# every tier gets a review pass because T0/T1 agent PRs are approvable only
# on a clean verdict — never on green checks alone (PRs #94/#99/#100 were
# green with HIGH review findings).
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to review'
        required: true

permissions:
  id-token: write   # anthropics/claude-code-action exchanges an OIDC token for its App token; without this every run fails "Could not fetch an OIDC token" (found 2026-08-29)
  contents: read
  checks: read
  actions: read     # the reviewer READS the native/deep-verify job logs (gh run view --log) instead of re-running the diff (red team on #127, F1)
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # THE REVIEWER NEVER EXECUTES THE PR'S CODE (red team on #127, F1). Running the diff's
      # own tests in this job would put PR-controlled code (a conftest.py, a modified
      # pipeline.sh, any collected test) in a shell that carries the claude[bot] App token —
      # the identity agent-approve/agent-merge trust for a `VERDICT(review): clean` final
      # line. That code could post the forged verdict itself and auto-merge (auto_merge_max_
      # tier=2 covers T0/T1/T2, and this workflow runs at every tier). Narrowing --allowedTools
      # cannot bound executed test code, so the fix is structural: the reviewer READS the test
      # results the `native` / `deep-verify` jobs already produced at this head (gh run view
      # --log) and never runs anything. Consequently the ONLY checkout is the TRUSTED base
      # branch — from which risk-tier's local shell body is read — and there is no PR checkout,
      # no toolchain, and no execution tool in the allowlist below.
      #
      # A bare `actions/checkout` on a `pull_request` event resolves to `refs/pull/<n>/merge`,
      # which INCLUDES the PR's own files (red team F3), so pin the base branch explicitly
      # (`base.ref` on the pull_request arm; `default_branch` covers workflow_dispatch).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          fetch-depth: 0                # trusted base branch, pinned (never the PR merge ref)

      # Resolve the head sha (used by the prompt) and refuse a fork on the workflow_dispatch
      # arm, which the job-level `if` does not cover. Fails closed: an unresolvable PR reviews
      # nothing. (The reviewer no longer executes PR code, so a fork would be read-safe, but a
      # fork PR gets no App token and, per GOVERNANCE.md §4b, is not reviewed here regardless.)
      - name: Resolve the head, and refuse a fork on the dispatch arm
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          repo=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.repo.full_name)
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          if [ "$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::#$PR is from fork $repo — not reviewed here (GOVERNANCE.md §4b)."
            exit 1
          fi
          [ -n "$sha" ] || { echo "::error::could not resolve the head of #$PR"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - id: tier
        uses: ./.github/actions/risk-tier     # read from the trusted base checkout above
        with: {pr: '${{ github.event.pull_request.number || inputs.pr }}'}

      - name: Claude Code — focused review
        # Every tier is reviewed (not only T2/T3) since the 2026-08-31 approval ruling:
        # T0/T1 approvals hang off this verdict, so the verdict must always exist.
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude,github-actions   # claude: agent PRs are opened by the Claude App (found on #76). github-actions: a ci-failure-router auto-fix push arrives as a synchronize event with that actor (live: run 33435939888 on #108, 2026-08-31)
          prompt: |
            Review PR #${{ github.event.pull_request.number || inputs.pr }} (risk
            ${{ steps.tier.outputs.label }}). Read CLAUDE.md and
            docs/GOVERNANCE.md §3 first. Focus, in order:
            1. Conformance to the cited spec sections (docs/protocol-l3.md,
               docs/trunk-link-layer.md) — flag any divergence precisely.
            2. Golden-rule violations: allocation after init in core/link,
               wall-clock use, inline timing constants, non-idempotent ops.
            3. Test integrity: do the new/changed tests assert the
               acceptance criteria of the linked issue (`gh issue view <n>`
               — read it, do not infer it from the PR body)? Any weakened or
               suspiciously narrow assertions?
               DO NOT run the diff's code — you hold no toolchain and no
               execution tool, by design (red team on #127, F1: a reviewer
               that runs PR code in this token-holding job could have its
               verdict forged). The diff's tests ALREADY RAN at this head in
               the `native (build + full test suite)` job and, at T2/T3, in
               `deep-verify`. Ground your test-integrity judgement in that
               real output: `gh pr checks` for pass/fail, and
               `gh run view <run-id> --log` (or `--log-failed`) for the
               actual assertions that ran. A finding grounded in that logged
               output outranks one from reading alone; label it per rule 11.
               If a required CI result is missing or unreadable, put that in
               NOT EXAMINED rather than guessing.
            4. Security: unchecked lengths/bounds in parsers, integer
               overflow in buffer math, injection risks in workflow/tool
               changes.
            Post ONE review comment: findings with file:line references,
            severity-ordered, or an explicit "no findings" — never pad.
            Prefix EVERY finding with its severity — exactly `[HIGH]`,
            `[MEDIUM]` or `[LOW]` — and CLASSIFY each by scope against the
            linked issue's acceptance criteria (read them with
            `gh issue view <n>`; do not infer them from the PR body). Two
            classes, and the routing rule that #134 established:
            - BLOCKING: a defect in the CHANGED code, a security hole, a
              weakened or narrowed test, a spec divergence, an unmet
              acceptance criterion of the linked issue, or a false claim
              the PR itself makes (dropping the claim is a valid, and often
              the smallest, fix). Each BLOCKS, whatever its severity.
            - FOLLOW-UP: a real improvement, hardening or pre-existing gap
              OUTSIDE the linked issue's acceptance criteria. Do NOT ask for
              it in this PR — that only grows the change (this is the
              accretion #128 spent five rounds on). Propose it as a new
              issue instead. Raise a FOLLOW-UP only for MEDIUM-or-above
              substance; pure style/naming/preference is a noted `[LOW]`.
            NEVER route a defect, security hole, weakened test, spec
            divergence or unmet acceptance criterion to FOLLOW-UP — those
            are BLOCKING at every severity. When unsure, BLOCK.
            List BLOCKING findings first (severity-ordered, file:line). Then
            a section headed exactly "## FOLLOW-UPS" — one bullet per
            proposed issue as "TITLE — one line of why", or "none".
            End with a required final section "NOT EXAMINED:" listing what
            was out of scope of this pass (files skipped, areas not checked).
            If nothing was excluded: "NOT EXAMINED: nothing excluded".
            After NOT EXAMINED, end with ONE final line, alone and exactly
            in this machine-readable form (the auto-approval gate parses it):
            `VERDICT(review): clean @ <head sha>` IF AND ONLY IF you found
            NO BLOCKING findings (FOLLOW-UPS and NOT EXAMINED entries do NOT
            count); otherwise `VERDICT(review): findings @ <head sha>`.
            <head sha> is the full 40-char head commit of the PR:
            ${{ steps.head.outputs.sha }} (if that is blank,
            use `gh pr view <n> --json headRefOid`).
            Do not approve, request changes, or modify code.
          # F1 fix (red team on #127): NO execution tool. The reviewer reads the diff and the
          # CI results, and never runs PR code, so nothing in this token-holding job can post
          # a forged verdict. The read-only `gh` verbs are enumerated (an allow-list, not a
          # denylist): pr view/diff/checks and run view/list to READ the already-run test
          # output, issue view for the linked issue, pr comment to post the one verdict.
          # Deliberately absent: any `Bash(python3*)`/`ctest*`/`cmake*`/`./pipeline.sh*` (all
          # of which execute arbitrary commands — cmake -E env, ctest -S, python3 -c), any
          # write verb (`gh pr review`/`merge`/`api`), and Edit/Write.
          claude_args: |
            --model claude-opus-5
            --allowedTools "Bash(gh pr view*),Bash(gh pr diff*),Bash(gh pr checks*),Bash(gh pr comment*),Bash(gh run view*),Bash(gh run list*),Bash(gh issue view*),Read,Grep,Glob"

