name: delivery-metrics
# Level 3 telemetry: append one JSON line per merged PR to metrics/delivery-log.jsonl on the
# unprotected `metrics` branch (RUNBOOK "Routine operations"). main's branch protection
# rejects the bot's push (GH006); until 2026-08-29 that rejection was masked by
# `|| echo "nothing to commit"` and every run was green while recording nothing
# (incident PR fix/metrics-branch). tools/metrics-ledger.sh now distinguishes "nothing to
# commit" from a rejected push and fails the run on the latter.
# Authorship is taken from PR labels: agent-authored | human-authored (default human).
on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read
  actions: read

concurrency:
  group: metrics-ledger        # shared with task-metrics: appends to the branch serialise
  cancel-in-progress: false

jobs:
  record:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {ref: main}

      - name: Switch to the metrics ledger branch (created from main if absent)
        run: |
          cp tools/metrics-ledger.sh "$RUNNER_TEMP/metrics-ledger.sh"   # main's copy survives the branch switch
          bash "$RUNNER_TEMP/metrics-ledger.sh" checkout

      - name: Collect PR metrics
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            // CI attempts for this branch = how many times the agent/human pushed before green
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              branch: pr.head.ref, event: 'pull_request', per_page: 100
            });
            const ciRuns = runs.data.workflow_runs.filter(r => r.name === 'ci');
            const firstPassGreen = ciRuns.length > 0 &&
              ciRuns[ciRuns.length - 1].conclusion === 'success' && ciRuns.length === 1;
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number
            });
            const labels = pr.labels.map(l => l.name);
            const rec = {
              pr: pr.number,
              title: pr.title,
              feature: (labels.find(l => l.startsWith('feature:')) || 'feature:none').slice(8),
              author_type: labels.includes('agent-authored') ? 'agent'
                         : labels.includes('human-authored') ? 'human' : 'human',
              created_at: pr.created_at,
              merged_at: pr.merged_at,
              cycle_time_h: Math.round((new Date(pr.merged_at) - new Date(pr.created_at)) / 36e4) / 10,
              commits: pr.commits,
              changed_files: pr.changed_files,
              additions: pr.additions,
              deletions: pr.deletions,
              ci_runs: ciRuns.length,
              first_pass_green: firstPassGreen,
              review_rounds: reviews.data.filter(r => r.state === 'CHANGES_REQUESTED').length,
              changes_requested: reviews.data.some(r => r.state === 'CHANGES_REQUESTED')
            };
            const fs = require('fs');
            fs.mkdirSync('metrics', {recursive: true});
            fs.appendFileSync('metrics/delivery-log.jsonl', JSON.stringify(rec) + '\n');

      - name: Commit and push to origin/metrics (a rejected push fails this run)
        run: |
          bash "$RUNNER_TEMP/metrics-ledger.sh" commit "delivery-metrics[bot]" \
            "metrics: record PR #${{ github.event.pull_request.number }}"
