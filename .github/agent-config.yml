# Agent autonomy configuration — referenced by workflows and agents.
# Changing this file is a T3 (governance) change.

# Highest EXPECTED risk tier that story enrichment may auto-release to
# dispatch (apply `ready` without human review of the story).
# 0 = docs/tests/scenarios only; 1 = + host-only code; 2 = + core/link
# (2 not recommended until telemetry supports it). T3 is never releasable.
auto_ready_max_tier: 1

# Highest ACTUAL risk tier (risk-score label on the PR) at which a clean
# machine-readable review verdict may satisfy the required PR approval for
# agent-authored PRs (claude-review `approve` job; ruling 2026-08-31).
# T3 is never auto-approved; -1 disables auto-approval entirely. The merge
# itself is always human, and CODEOWNERS paths always need the owner.
auto_approve_max_tier: 2

# Backstops that make auto-release safe (do not remove):
# - ready-gate still validates the enriched story mechanically
# - risk-score re-rates the ACTUAL diff at PR time; a T2+/T3 outcome from
#   an auto-released story is reviewed as a prediction failure
# - CODEOWNERS + human merge approval apply to every PR regardless
