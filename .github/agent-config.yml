# Agent autonomy configuration — referenced by workflows and agents.
# Changing this file is a T3 (governance) change.

# Highest EXPECTED risk tier that story enrichment may auto-release to
# dispatch (apply `ready` without human review of the story).
# 0 = docs/tests/scenarios only; 1 = + host-only code; 2 = + core/link
# (2 not recommended until telemetry supports it). T3 is never releasable.
auto_ready_max_tier: 1

# Highest ACTUAL risk tier (risk-score label on the PR) at which a clean
# machine-readable review verdict may satisfy the required PR approval for
# agent-authored PRs (claude-review `approve` job; ruling 2026-08-31).
# T3 is never auto-approved; -1 disables auto-approval entirely. The merge
# itself is always human, and CODEOWNERS paths always need the owner.
auto_approve_max_tier: 2

# Highest ACTUAL risk tier (risk-score label on the PR) at which a complete
# agent PR is MERGED without a human (agent-merge workflow; ruling
# 2026-09-02). T3 is never merged by an agent; -1 disables autonomous merge
# entirely and returns the merge click to a human. A merge additionally
# requires, at the exact head being merged: clean review verdict (plus
# red-team at T2+), every check finished green, and NO CODEOWNERS-owned path
# outside the agent-sanctioned set (docs/OPEN-QUESTIONS.md,
# specs/**/tasks.md) — ground truth and governance always need their owner.
auto_merge_max_tier: 2

# How many bounded fix attempts the `review-fix` loop may take on one PR
# before it releases the claim and escalates `needs-human` (raised from 2 to
# 4, ruling 2026-09-03: PR #116 exhausted two attempts while still making
# real progress each round). Attempts are the PR labels review-fix-1..N, at
# most one per head commit; nothing resets them but a human. 0 disables the
# loop. Read at RUN time from the default branch, so retuning it needs no
# workflow-scope push — which matters because the fixer agent itself cannot
# edit .github/workflows/*.
review_fix_max_attempts: 4

# Backstops that make auto-release safe (do not remove):
# - ready-gate still validates the enriched story mechanically
# - risk-score re-rates the ACTUAL diff at PR time; a T2+/T3 outcome from
#   an auto-released story is reviewed as a prediction failure
# - CODEOWNERS + human merge approval apply to every PR regardless
