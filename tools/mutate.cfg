# Mutation-testing configuration for tools/mutate.sh (spec 001 T058; research R-04).
# Facts verified against https://github.com/mull-project/mull on 2026-08-28:
#   - release 0.34.0 ships .deb packages per LLVM major for Ubuntu 22.04 and 24.04, named
#     Mull-<N>-0.34.0-LLVM-<x.y.z>-ubuntu-amd64-<22.04|24.04>.deb
#   - the compiler plugin is /usr/lib/mull-ir-frontend-<N>, used with
#     -fpass-plugin=... -g -grecord-command-line (one file per compile: CMake does that)
#   - the runner is mull-runner-<N>; incremental mode is configured in mull.yml with
#     gitDiffRef: <ref> and gitProjectRoot: <path>
# <N> is the clang major in use; mutate.sh detects it from `clang++ --version` (override:
# OMGP_CLANG_MAJOR). CI installs the matching deb (T062, human-delivered).

[mull]
version = 0.34.0
clang_major = 14
runner = mull-runner-{clang_major}
plugin = /usr/lib/mull-ir-frontend-{clang_major}
deb_22_04 = https://github.com/mull-project/mull/releases/download/{version}/Mull-{clang_major}-{version}-LLVM-{llvm}-ubuntu-amd64-22.04.deb

[policy]
# Kill rate (killed / (killed + survived), not-covered excluded) below which mutate.sh exits 1.
threshold_pct = 80
# Directories whose changed lines are in scope (embedded path, CLAUDE.md rule 5).
scope_dirs = l3 link core
# Seconds per test-binary run before Mull declares a mutant a timeout (treated as killed).
timeout_ms = 20000

[mutators]
# Mull mutator groups applied (see Mull docs "Supported mutations"). Must be names Mull
# knows: an unknown name (observed with a made-up `cxx_remove_void`) makes the IR frontend
# emit NO mutants at all, and the runner then reports "No mutants found" — mutate.sh
# treats that as a failure, never as a pass.
groups = cxx_all
